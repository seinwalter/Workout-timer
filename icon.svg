<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="50%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ff8787"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <circle cx="256" cy="256" r="160" fill="none" stroke="#2a2a2a" stroke-width="14"/>

  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accent)" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="753.98" stroke-dashoffset="188.5"
          transform="rotate(-90 256 256)"/>

  <g filter="url(#shadow)">
    <text x="256" y="295" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
          font-size="130" font-weight="800" fill="url(#accent)" text-anchor="middle"
          letter-spacing="-5">FC</text>
  </g>
</svg>
