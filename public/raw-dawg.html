<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PROTOCOL">
    <meta name="theme-color" content="#0d1117">
    <meta name="description" content="PROTOCOL — a minimal daily discipline tracker: quit habits, build habits, follow your rules.">
    <link rel="manifest" href="data:application/json,%7B%22name%22%3A%22PROTOCOL%22%2C%22short_name%22%3A%22PROTOCOL%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230d1117%22%2C%22theme_color%22%3A%22%230d1117%22%7D">
    <title>PROTOCOL — Discipline Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg0: #0b0e14;
            --bg1: #11151d;
            --card: #141923;
            --card2: #1b2130;
            --line: #252c3a;
            --faint: #232a38;
            --text: #e8ebf1;
            --muted: #8f99ab;
            --acc1: #58a6ff;
            --acc2: #85c0ff;
            --danger: #f85149;
            --good: #3fb950;
            --warn: #d29922;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg0);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
            padding:
                env(safe-area-inset-top) env(safe-area-inset-right)
                calc(env(safe-area-inset-bottom) + 32px) env(safe-area-inset-left);
        }

        .wrap { max-width: 540px; margin: 0 auto; padding: 16px 16px 0; }

        /* ---------- Header: date + large "Today" title, settings and + ---------- */
        .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 18px 0 14px; }
        .top .date { font-size: .8rem; color: var(--muted); font-weight: 700; letter-spacing: .3px; text-transform: uppercase; }
        .top h1 { font-size: 2rem; font-weight: 800; letter-spacing: -.5px; line-height: 1.1; margin-top: 2px; }
        .top .btns { display: flex; gap: 8px; flex: 0 0 auto; }
        .hdr-btn {
            width: 44px; height: 44px; border-radius: 22px;
            background: var(--card); border: 1px solid var(--line); color: var(--muted);
            font-size: 1.15rem; cursor: pointer; transition: transform .25s;
            display: flex; align-items: center; justify-content: center;
        }
        .gear:active { transform: rotate(60deg); color: var(--acc2); }
        .add-btn { color: var(--text); font-size: 1.3rem; }
        .add-btn:active { transform: scale(.92); border-color: var(--acc1); }

        /* ---------- Day progress line ---------- */
        .dayprog {
            display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line);
            border-radius: 16px; padding: 12px 14px; margin-bottom: 6px;
        }
        .dayprog .t { font-size: .95rem; font-weight: 700; }
        .dayprog .s { font-size: .8rem; color: var(--muted); margin-top: 2px; line-height: 1.35; }

        /* ---------- Sections + grouped rows ---------- */
        .sec-h { display: flex; justify-content: space-between; font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .3px; margin: 20px 4px 8px; text-transform: uppercase; }
        .group { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
        .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 72px; cursor: pointer; }
        .row + .row { border-top: 1px solid var(--line); }
        .row:active { background: var(--card2); }
        .ic {
            width: 42px; height: 42px; border-radius: 12px; flex: 0 0 auto; font-size: 1.3rem;
            display: flex; align-items: center; justify-content: center;
            background: color-mix(in srgb, var(--accent, var(--acc1)) 16%, transparent);
        }
        .mid { flex: 1; min-width: 0; }
        .mid .nm { font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mid .sub { font-size: .8rem; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
        .mid .sub b { color: var(--text); font-weight: 700; }
        .mid .big-sub { font-size: 1.05rem; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }

        /* recent-days strip: one cell per day, today outlined */
        .strip { display: flex; gap: 3px; margin-top: 7px; }
        .strip i { width: 14px; height: 14px; border-radius: 4px; background: var(--faint); display: block; flex: 0 0 auto; }
        .strip i.done { background: var(--accent, var(--acc1)); }
        .strip i.win { background: var(--good); }
        .strip i.loss { background: var(--danger); }
        .strip i.rest, .hm .rest, .legend i.rest { background: repeating-linear-gradient(135deg, #3a4356 0 2px, transparent 2px 5px); }
        .strip i.gap, .hm .gap, .legend i.gap { background: transparent; box-shadow: inset 0 0 0 1px #4a5468; }
        .strip i.off { background: transparent; }
        .strip i.today { outline: 2px solid var(--text); outline-offset: 1px; }

        .act { display: flex; gap: 8px; flex: 0 0 auto; align-items: center; }
        .cb {
            width: 44px; height: 44px; border-radius: 22px; background: transparent; cursor: pointer;
            font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; justify-content: center;
        }
        .cb.ok { border: 2px solid var(--good); color: var(--good); }
        .cb.no { border: 2px solid color-mix(in srgb, var(--danger) 45%, transparent); color: var(--danger); }
        .cb:active { transform: scale(.94); }
        .pill {
            min-height: 44px; padding: 0 16px; border-radius: 22px; font-size: .9rem; font-weight: 700; cursor: pointer;
            background: color-mix(in srgb, var(--good) 10%, transparent); color: var(--good);
            border: 1px solid color-mix(in srgb, var(--good) 45%, transparent);
        }
        .pill.acc { background: color-mix(in srgb, var(--accent, var(--acc1)) 12%, transparent); color: var(--accent, var(--acc1)); border-color: color-mix(in srgb, var(--accent, var(--acc1)) 50%, transparent); }
        .tag { font-size: .8rem; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--card2); color: var(--muted); white-space: nowrap; }
        .tag.win { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
        .tag.loss { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

        /* hold-to-check: a ring fills while pressed; completes after 0.6s */
        .hold {
            position: relative; width: 48px; height: 48px; border: none; background: none; cursor: pointer; flex: 0 0 auto;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
        }
        .hold svg { position: absolute; inset: 0; }
        .hold .trk { stroke: var(--faint); }
        .hold .prog { stroke: var(--accent, var(--acc1)); stroke-dasharray: 132; stroke-dashoffset: 132; transition: stroke-dashoffset .12s; }
        .hold.holding .prog { stroke-dashoffset: 0; transition: stroke-dashoffset .6s linear; }
        .hold span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; font-weight: 800; color: var(--accent, var(--acc1)); }
        .done-dot { width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: var(--accent, var(--acc1)); color: #0b0e14; font-weight: 900; }

        .cleanbar { height: 5px; background: var(--faint); border-radius: 3px; margin-top: 7px; overflow: hidden; }
        .cleanbar div { height: 100%; background: var(--accent, var(--acc1)); border-radius: 3px; }

        /* ---------- Active fast card with progress ring ---------- */
        .fast { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
        .fast-top { display: flex; gap: 14px; align-items: center; cursor: pointer; }
        .ringwrap { position: relative; width: 140px; height: 140px; flex: 0 0 auto; }
        .ringwrap svg { display: block; }
        .ringc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .ringc .el { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
        .ringc .lab { font-size: .75rem; color: var(--muted); margin-top: 2px; }
        .fi .nm { font-size: 1.05rem; font-weight: 700; }
        .stagechip {
            display: inline-block; margin-top: 6px; font-size: .8rem; font-weight: 700; padding: 4px 9px; border-radius: 999px;
            color: var(--accent, var(--acc1)); background: color-mix(in srgb, var(--accent, var(--acc1)) 12%, transparent);
            border: 1px solid color-mix(in srgb, var(--accent, var(--acc1)) 35%, transparent);
        }
        .fi .kv { font-size: .8rem; color: var(--muted); margin-top: 8px; line-height: 1.6; font-variant-numeric: tabular-nums; }
        .fi .kv b { color: var(--text); }

        /* ---------- Buttons (detail page + cards) ---------- */
        .ministats { display: flex; gap: 8px; margin-bottom: 14px; }
        .ministats .m { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 4px; text-align: center; }
        .ministats .m b { display: block; font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
        .ministats .m > span { display: block; font-size: .75rem; color: var(--muted); margin-top: 3px; }

        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            flex: 1; min-height: 48px; padding: 12px; border-radius: 12px; border: none; font-weight: 800;
            font-size: .9rem; cursor: pointer; letter-spacing: .2px; transition: transform .08s, filter .2s;
        }
        .btn:active { transform: scale(.97); }
        .btn-danger { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent); }
        .btn-good { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); border: 1px solid color-mix(in srgb, var(--good) 42%, transparent); }
        .btn-done { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); border: 1px solid color-mix(in srgb, var(--good) 45%, transparent); }
        .btn-plain { background: var(--card2); color: var(--text); border: 1px solid var(--line); }
        .btn-quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); }
        .btn.on { outline: 2px solid currentColor; outline-offset: 2px; }

        /* ---------- Detail page (pushed full screen) ---------- */
        .page {
            position: fixed; inset: 0; z-index: 90; background: var(--bg0); overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 40px) env(safe-area-inset-left);
            animation: push .22s ease;
        }
        .page[hidden] { display: none; }
        @keyframes push { from { transform: translateX(28%); opacity: .4; } to { transform: none; opacity: 1; } }
        .page-in { max-width: 540px; margin: 0 auto; padding: 8px 16px 0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; min-height: 52px; }
        .navbtn { background: none; border: none; color: var(--acc1); font-size: 1.05rem; font-weight: 600; min-height: 44px; min-width: 44px; padding: 0 4px; cursor: pointer; }
        .p-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; }
        .p-head .ic { width: 52px; height: 52px; font-size: 1.7rem; border-radius: 15px; }
        .p-head h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.3px; line-height: 1.15; }
        .p-head .meta { font-size: .8rem; color: var(--muted); margin-top: 2px; }
        .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
        .panel + .panel { margin-top: 12px; }
        .p-status { font-size: .9rem; color: var(--muted); margin: 0 2px 10px; }
        .p-status b { color: var(--text); }
        .plan { font-size: .92rem; line-height: 1.5; }
        .plan .lbl { font-size: .75rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 4px; }

        /* heatmap: 7 rows (Mon–Sun), one column per week, today bottom-right */
        .hm { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px); grid-auto-columns: 14px; gap: 3px; }
        .hm > * { width: 14px; height: 14px; border-radius: 3px; background: var(--faint); border: none; padding: 0; display: block; }
        .hm button { cursor: pointer; }
        .hm .done { background: var(--accent, var(--acc1)); }
        .hm .clean { background: color-mix(in srgb, var(--accent, var(--acc1)) 70%, transparent); }
        .hm .win { background: var(--good); }
        .hm .loss { background: var(--danger); }
        .hm .off { background: transparent; }
        .hm .fut { background: transparent; }
        .hm .today { outline: 2px solid var(--text); outline-offset: 1px; }
        .hm-months { display: grid; grid-auto-flow: column; grid-auto-columns: 14px; gap: 3px; font-size: .75rem; color: var(--muted); margin-top: 6px; height: 14px; overflow: visible; white-space: nowrap; }
        .hm-wrap { display: flex; gap: 6px; }
        .hm-days { display: grid; grid-template-rows: repeat(7, 14px); gap: 3px; font-size: .75rem; color: var(--muted); line-height: 14px; }
        .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .8rem; color: var(--muted); margin-top: 12px; align-items: center; }
        .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

        /* weekday bars */
        .wkbars { display: flex; gap: 8px; align-items: flex-end; height: 104px; }
        .wkbars > div { flex: 1; text-align: center; font-size: .75rem; color: var(--muted); display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
        .wkbars .b { background: var(--accent, var(--acc1)); border-radius: 6px 6px 3px 3px; margin: 3px auto 5px; width: 70%; max-width: 30px; min-height: 3px; }
        .wkbars .b.lo { background: var(--warn); }
        .wkbars .pc { color: var(--text); font-weight: 700; }
        .insight { font-size: .85rem; color: var(--muted); margin-top: 10px; line-height: 1.4; }
        .note-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .88rem; padding: 10px 0; }
        .note-row + .note-row { border-top: 1px solid var(--line); }
        .note-row .d { color: var(--muted); flex: 0 0 auto; }
        .note-row .t { text-align: right; flex: 1; min-width: 0; }
        .x-btn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; flex: 0 0 auto; margin: -8px 0; }
        details.more { margin-top: 12px; }
        details.more summary { list-style: none; cursor: pointer; min-height: 48px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: .95rem; padding: 0 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
        details.more summary::-webkit-details-marker { display: none; }
        details.more summary::after { content: '›'; color: var(--muted); font-size: 1.3rem; transition: transform .2s; }
        details.more[open] summary::after { transform: rotate(90deg); }
        details.more > .inner { padding: 6px 4px 0; }

        /* color swatches in the form */
        .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
        .sw { width: 44px; height: 44px; border-radius: 22px; border: 3px solid transparent; cursor: pointer; }
        .sw.sel { border-color: var(--text); }
        .seg { display: inline-flex; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
        .seg button { min-height: 38px; padding: 0 14px; border: none; border-radius: 9px; background: none; color: var(--muted); font-weight: 700; font-size: .85rem; cursor: pointer; }
        .seg button.sel { background: var(--bg1); color: var(--text); }

        /* ---------- Empty state ---------- */
        .empty { text-align: center; padding: 40px 10px 26px; }
        .empty h2 { margin: 12px 0 6px; font-size: 1.2rem; }
        .empty p { color: var(--muted); font-size: .9rem; margin-bottom: 18px; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .chip {
            background: var(--card2); border: 1px solid var(--line); color: var(--text);
            padding: 0 14px; min-height: 44px; border-radius: 22px; font-size: .85rem; font-weight: 600; cursor: pointer;
        }
        .chip:active { border-color: var(--acc2); }
        /* fasting goal picker — compact selectable chips */
        .goalchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
        .goalchips .chip { padding: 0 12px; min-height: 44px; font-size: .85rem; border-radius: 12px; }
        .goalchips .chip.sel { border-color: var(--accent, var(--acc1)); color: var(--accent, var(--acc1)); background: color-mix(in srgb, var(--accent, var(--acc1)) 10%, transparent); }
        .stageline { font-size: .78rem; color: var(--muted); margin-top: 4px; line-height: 1.35; }
        .stageline b { color: var(--accent, var(--acc1)); font-weight: 700; }

        /* ---------- Modal ---------- */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
            display: none; align-items: flex-end; justify-content: center; z-index: 100;
        }
        .overlay.show { display: flex; }
        .sheet {
            background: var(--bg1); border: 1px solid var(--line); border-bottom: none;
            border-radius: 18px 18px 0 0; width: 100%; max-width: 540px;
            max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 20px 18px calc(env(safe-area-inset-bottom) + 26px);
            animation: up .25s ease;
        }
        @keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .sheet-grab { width: 40px; height: 4px; background: var(--line); border-radius: 4px; margin: 0 auto 16px; }
        .sheet h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 4px; }
        .sheet .sub { color: var(--muted); font-size: .85rem; margin-bottom: 18px; }

        /* ---------- Craving / urge-surf intervention (the panic button) ---------- */
        .overlay.full { align-items: flex-start; padding: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .craving {
            position: relative; width: 100%; max-width: 540px; margin: 0 auto; min-height: 100%;
            display: flex; flex-direction: column; align-items: center;
            padding: calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 24px);
            background: radial-gradient(120% 75% at 50% 0%, color-mix(in srgb, var(--accent, var(--acc1)) 22%, var(--bg1)) 0%, var(--bg0) 62%);
            animation: fade .3s ease;
        }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        .cr-x { position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: 16px;
            background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; width: 44px; height: 44px; }
        .cr-head { font-size: 1.5rem; font-weight: 900; text-align: center; margin-top: 6px; }
        .cr-sub { color: var(--muted); font-size: .9rem; text-align: center; line-height: 1.45; margin: 8px 4px 0; max-width: 340px; }
        .cr-orb-wrap { height: 220px; display: flex; align-items: center; justify-content: center; margin: 4px 0; }
        .cr-orb {
            width: 148px; height: 148px; border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, color-mix(in srgb, var(--accent, var(--acc1)) 82%, #fff), var(--accent, var(--acc1)) 72%);
            box-shadow: 0 0 62px color-mix(in srgb, var(--accent, var(--acc1)) 55%, transparent);
            display: flex; align-items: center; justify-content: center;
            transform: scale(1); transition: transform 4s ease-in-out; will-change: transform;
        }
        .cr-label { font-weight: 700; color: #0b1526; font-size: 1rem; letter-spacing: .5px; }
        .cr-timer { font-variant-numeric: tabular-nums; font-size: 1.1rem; font-weight: 800; color: var(--accent, var(--acc2)); margin-top: 4px; }
        .cr-timer span { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .6px; }
        .cr-stakes { display: flex; gap: 8px; width: 100%; margin-top: 18px; }
        .cr-stakes .m { flex: 1; background: rgba(255,255,255,.045); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; text-align: center; }
        .cr-stakes .m b { display: block; font-size: 1.05rem; font-weight: 800; }
        .cr-stakes .m span { display: block; font-size: .75rem; color: var(--muted); margin-top: 3px; }
        .cr-why { width: 100%; background: rgba(255,255,255,.045); border: 1px solid var(--line);
            border-left: 3px solid var(--accent, var(--acc1)); border-radius: 12px; padding: 12px 14px; margin-top: 14px; }
        .cr-why .t { font-size: .75rem; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
        .cr-why ul { margin: 0; padding-left: 18px; }
        .cr-why li { font-size: .92rem; line-height: 1.5; margin: 2px 0; }
        .cr-spacer { flex: 1; min-height: 16px; }
        .cr-beat {
            width: 100%; padding: 16px; border: none; border-radius: 13px; font-weight: 700; font-size: 1rem; cursor: pointer;
            background: var(--good); color: #06210f;
            box-shadow: 0 8px 22px color-mix(in srgb, var(--good) 28%, transparent); transition: transform .08s;
        }
        .cr-beat:active { transform: scale(.98); }

        label.f { display: block; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 14px 0 6px; font-weight: 700; }
        .wk-row { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); margin-top: 4px; min-height: 44px; cursor: pointer; }
        .wk-row input { width: 18px; height: 18px; accent-color: var(--acc1); }
        input.f, textarea.f, select.f {
            width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--text);
            border-radius: 12px; padding: 13px; font-size: 1rem; font-family: inherit;
        }

        if (native && (nativeAt > localAt || (!state.habits.length && native.habits.length))) {
            state = native;
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
            render();
        } else {
            await prefsCall(() => Preferences.set({ key: STORAGE_KEY, value: JSON.stringify(state) }));
        }
    }
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    /* ---------- Date / streak helpers ---------- */
    function localKey(d) {
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    const todayKey = () => localKey(new Date());

    // current streak length in ms for a quit-type habit
    function quitMs(h) { return Math.max(0, Date.now() - new Date(h.startDate).getTime()); }

    // boundaries of every streak segment: created -> relapses... -> now
    function segments(h) {
        const bounds = [new Date(h.createdDate).getTime(), ...(h.relapses || []).map(r => new Date(r.date).getTime())]
            .sort((a, b) => a - b);
        const segs = [];
        for (let i = 0; i < bounds.length; i++) {
            const end = (i + 1 < bounds.length) ? bounds[i + 1] : Date.now();
            segs.push(end - bounds[i]);
        }
        return segs;
    }
    function bestMs(h) { return Math.max(0, ...segments(h)); }

    /* ---------- Calendar helpers ---------- */
    function dayStart(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
    function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
    function keyToDate(k) { return new Date(k + 'T00:00:00'); }
    // Monday-start week id, used for the weekly skip allowance
    function weekKey(d) { const x = dayStart(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return localKey(x); }
    const createdKey = h => localKey(new Date(h.createdDate || h.startDate || Date.now()));

    /* ---------- BUILD: daily check-ins with a weekly skip allowance ----------
       h.checkIns = ['YYYY-MM-DD'...]; h.skips = ['YYYY-MM-DD'...].
       A skip bridges a day without breaking the streak (and doesn't add to it).
       One skip per Monday-start week — scarce on purpose: a reserve you spend,
       not a loophole. Today not yet done never breaks the streak. */
    const SKIPS_PER_WEEK = 1;
    function skipsUsed(h, d) {
        const wk = weekKey(d);
        return (h.skips || []).filter(k => weekKey(keyToDate(k)) === wk).length;
    }
    const skipsLeft = (h, d = new Date()) => Math.max(0, SKIPS_PER_WEEK - skipsUsed(h, d));
    function buildDay(h, k) {   // 'done' | 'skip' | 'miss' | 'off' (before tracking) | 'fut'
        if (k > todayKey()) return 'fut';
        if ((h.checkIns || []).includes(k)) return 'done';
        if ((h.skips || []).includes(k)) return 'skip';
        if (k < createdKey(h)) return 'off';
        return 'miss';
    }
    function buildStreak(h) {
        const done = new Set(h.checkIns || []), skip = new Set(h.skips || []);
        let d = dayStart(new Date());
        if (!done.has(localKey(d)) && !skip.has(localKey(d))) d = addDays(d, -1);   // today still open
        let n = 0;
        for (let i = 0; i < 5000; i++) {
            const k = localKey(d);
            if (done.has(k)) n++;
            else if (!skip.has(k)) break;
            d = addDays(d, -1);   // calendar step — DST-safe
        }
        return n;
    }
    function bestBuildStreak(h) {
        const done = new Set(h.checkIns || []), skip = new Set(h.skips || []);
        const keys = [...done, ...skip].sort();
        if (!keys.length) return 0;
        let best = 0, run = 0;
        const end = todayKey();
        for (let d = keyToDate(keys[0]), i = 0; i < 5000; d = addDays(d, 1), i++) {
            const k = localKey(d);
            if (k > end) break;
            if (done.has(k)) { run++; best = Math.max(best, run); }
            else if (!skip.has(k) && k !== end) run = 0;
        }
        return best;
    }

    /* ---------- RULES ('disc'): h.outcomes = { 'YYYY-MM-DD': 'win'|'loss'|'rest' } ----------
       'rest' = no session that day (market holiday, chose not to trade) — neutral.
       A scheduled day left unlogged is a GAP once it's two days old (yesterday can
       still be backfilled). Gaps break the streak — the day you skip logging is
       the day most likely to have gone wrong. Days before h.gapsFrom (set when
       this rule shipped) keep the old "unlogged doesn't count" behaviour, so
       existing history isn't retroactively broken. */
    function isScheduled(h, d) {
        if (!h.reminderWeekdays) return true;
        const wd = d.getDay();
        return wd !== 0 && wd !== 6;
    }
    function isRestDay(h) { return !isScheduled(h, new Date()); }
    function discDay(h, k) {   // 'win'|'loss'|'rest'|'gap'|'open'|'off'|'fut'
        if (k > todayKey()) return 'fut';
        const o = (h.outcomes || {})[k];
        if (o) return o;
        if (k < createdKey(h)) return 'off';
        const d = keyToDate(k);
        if (!isScheduled(h, d)) return 'off';
        if (k >= localKey(addDays(new Date(), -1))) return 'open';   // today or yesterday: still loggable
        if (h.gapsFrom && k < h.gapsFrom) return 'off';                 // legacy days: unlogged was allowed
        if (!h.gapsFrom) return 'off';
        return 'gap';
    }
    function discStreak(h) {
        const start = [createdKey(h), ...Object.keys(h.outcomes || {})].sort()[0];
        let n = 0;
        for (let d = dayStart(new Date()), i = 0; i < 5000; d = addDays(d, -1), i++) {
            const k = localKey(d);
            if (k < start) break;
            const s = discDay(h, k);
            if (s === 'win') n++;
            else if (s === 'loss' || s === 'gap') break;
        }
        return n;
    }
    function bestDiscStreak(h) {
        const start = [createdKey(h), ...Object.keys(h.outcomes || {})].sort()[0];
        let best = 0, run = 0;
        const end = todayKey();
        for (let d = keyToDate(start), i = 0; i < 5000; d = addDays(d, 1), i++) {
            const k = localKey(d);
            if (k > end) break;
            const s = discDay(h, k);
            if (s === 'win') { run++; best = Math.max(best, run); }
            else if (s === 'loss' || s === 'gap') run = 0;
        }
        return best;
    }
    function discCounts(h, sinceKey) {
        let wins = 0, losses = 0, rests = 0;
        for (const [k, v] of Object.entries(h.outcomes || {})) {
            if (sinceKey && k < sinceKey) continue;
            if (v === 'win') wins++; else if (v === 'loss') losses++; else if (v === 'rest') rests++;
        }
        return { wins, losses, rests, total: wins + losses };
    }
    // Adherence over the last N days: on-plan sessions ÷ sessions (gaps count as misses).
    function adherence(h, days = 30) {
        let win = 0, bad = 0;
        for (let i = 0; i < days; i++) {
            const s = discDay(h, localKey(addDays(new Date(), -i)));
            if (s === 'win') win++; else if (s === 'loss' || s === 'gap') bad++;
        }
        return win + bad ? Math.round(win / (win + bad) * 100) : null;
    }

    /* ---------- QUIT: clean-day share alongside the live clock ---------- */
    function relapseKeys(h) { return new Set((h.relapses || []).map(r => localKey(new Date(r.date)))); }
    function cleanStats(h, days = 30) {
        const rk = relapseKeys(h), from = createdKey(h);
        let clean = 0, total = 0;
        for (let i = 0; i < days; i++) {
            const k = localKey(addDays(new Date(), -i));
            if (k < from) break;
            total++; if (!rk.has(k)) clean++;
        }
        return { clean, total };
    }

    /* Fasting ('fast') helpers — h.fastStart is the active fast's ISO start (null when
       idle); h.fasts is the completed-session log [{start, end, hours, goal, hit}]. */
    function fastMs(h) { return h.fastStart ? Math.max(0, Date.now() - new Date(h.fastStart).getTime()) : 0; }
    function fastStats(h) {
        const log = h.fasts || [];
        const longest = log.reduce((m, f) => Math.max(m, f.hours || 0), 0);
        const hits = log.filter(f => f.hit).length;
        return { count: log.length, longest, hits, hitRate: log.length ? Math.round(hits / log.length * 100) : 0 };
    }

    function achievedQuit(ms) { return QUIT_MS.filter(m => ms >= m[0]); }
    function nextQuit(ms) { return QUIT_MS.find(m => ms < m[0]) || null; }
    function achievedBuildCount(days) { return BUILD_DAYS.filter(d => days >= d).length; }
    function nextBuild(days) { return BUILD_DAYS.find(d => days < d) || null; }

    /* ---------- Formatting ---------- */
    function fmtClock(ms) {
        const h = Math.floor((ms % DAY) / HOUR), m = Math.floor((ms % HOUR) / MIN), s = Math.floor((ms % MIN) / 1000);
        const p = n => String(n).padStart(2, '0');
        return p(h) + ':' + p(m) + ':' + p(s);
    }
    // like fmtClock but hours don't wrap at 24 — a 53h fast reads 53:12:08
    function fmtFastClock(ms) {
        const h = Math.floor(ms / HOUR), m = Math.floor((ms % HOUR) / MIN), s = Math.floor((ms % MIN) / 1000);
        const p = n => String(n).padStart(2, '0');
        return h + ':' + p(m) + ':' + p(s);
    }
    function fmtMoney(n) {
        if (n >= 1000) return '$' + (n/1000).toFixed(n >= 10000 ? 0 : 1) + 'k';
        return '$' + Math.round(n);
    }
    function fmtHours(h) {
        if (h >= 24) return Math.round(h/24) + 'd';
        return Math.round(h) + 'h';
    }
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    /* ============================================================
       RENDER — "Today" home: what needs doing now, then everything else.
       Sections: Active now (running fasts) · Due today (unlogged check-ins and
       rules) · Done today · Tracking (quit clocks, idle fasts, rest days).
       Each tracker is a compact row; tap it for the full detail page.
       ============================================================ */
    function render() {
        renderHome();
        if (pageId) renderPage();
    }

    function fmtTime(d) { return new Date(d).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
    function fmtDayTime(d) {
        const x = new Date(d), today = dayStart(new Date()), dd = dayStart(x);
        const diff = Math.round((dd - today) / DAY);
        const day = diff === 0 ? 'Today' : diff === -1 ? 'Yesterday' : diff === 1 ? 'Tomorrow' : x.toLocaleDateString([], { weekday: 'short' });
        return day + ' ' + fmtTime(x);
    }
    function fmtDur(ms) {   // 3h 36m / 45m / 2d 4h
        const m = Math.max(0, Math.round(ms / MIN));
        if (m >= 48 * 60) return Math.floor(m / 1440) + 'd ' + Math.floor((m % 1440) / 60) + 'h';
        if (m >= 60) return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
        return m + 'm';
    }
    function fmtQuitClock(ms) {
        const d = Math.floor(ms / DAY);
        return (d ? d + 'd ' : '') + fmtClock(ms);
    }

    function classify() {
        const g = { active: [], due: [], done: [], tracking: [] };
        const tk = todayKey();
        for (const h of state.habits) {
            if (h.type === 'fast') (h.fastStart ? g.active : g.tracking).push(h);
            else if (h.type === 'build') {
                const s = buildDay(h, tk);
                (s === 'done' || s === 'skip' ? g.done : g.due).push(h);
            } else if (h.type === 'disc') {
                if ((h.outcomes || {})[tk]) g.done.push(h);
                else if (isRestDay(h)) g.tracking.push(h);
                else g.due.push(h);
            } else g.tracking.push(h);
        }
        return g;
    }

    function renderHome() {
        const now = new Date();
        document.getElementById('hdrDate').textContent =
            now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
        const el = document.getElementById('list');
        if (!state.habits.length) { el.innerHTML = emptyState(); return; }
        const g = classify();
        let html = dayProgress(g);
        if (g.active.length) html += sec('Active now') + g.active.map(fastCard).join('<div style="height:10px"></div>');
        if (g.due.length) html += sec('Due today', g.due.length) + group(g.due);
        if (g.done.length) html += sec('Done today', g.done.length) + group(g.done);
        if (g.tracking.length) html += sec('Tracking') + group(g.tracking);
        el.innerHTML = html;
    }
    const sec = (t, n) => `<div class="sec-h"><span>${esc(t)}</span>${n != null ? `<span>${n}</span>` : ''}</div>`;
    const group = list => `<div class="group">${list.map(row).join('')}</div>`;

    function dayProgress(g) {
        const total = g.due.length + g.done.length;
        const bits = [];
        for (const h of g.active) bits.push(`${esc(h.name)} goal ${fmtDayTime(new Date(h.fastStart).getTime() + (h.goalHours || 16) * HOUR)}`);
        if (!total && !bits.length) return '';
        const pct = total ? g.done.length / total : 1;
        const C = 2 * Math.PI * 15;
        const ring = `<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--faint)" stroke-width="5"/>
            <circle cx="18" cy="18" r="15" fill="none" stroke="var(--good)" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="${(C * pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 18 18)"/></svg>`;
        const title = !total ? 'Nothing due today'
            : g.due.length === 0 ? `All ${total} done today`
            : `${g.done.length} of ${total} done today`;
        if (g.due.length) bits.unshift('Left: ' + g.due.map(h => esc(h.name)).join(', '));
        return `<div class="dayprog">${ring}<div><div class="t">${title}</div><div class="s">${bits.join(' · ')}</div></div></div>`;
    }

    function emptyState() {
        const quick = ['weed','gaming','screen','trading','fasting','gym'];
        return `<div class="empty">
            <h2>Start tracking</h2>
            <p>Quit something. Build something. Follow your rules.</p>
            <div class="chips">
                ${quick.map(k => { const p = presetByKey(k); return `<button class="chip" data-action="quick-add" data-preset="${k}">${p.icon} ${esc(p.name)}</button>`; }).join('')}
                <button class="chip" data-action="add">＋ Custom…</button>
            </div>
        </div>`;
    }

    function row(h) {
        const accent = h.color || '#58a6ff';
        let body = '', act = '';
        if (h.type === 'build') [body, act] = buildRow(h);
        else if (h.type === 'disc') [body, act] = discRow(h);
        else if (h.type === 'fast') [body, act] = fastIdleRow(h);
        else [body, act] = quitRow(h);
        return `<div class="row" style="--accent:${accent}" data-action="open" data-id="${h.id}">
            <div class="ic">${h.icon || '⭐'}</div>
            <div class="mid"><div class="nm">${esc(h.name)}</div>${body}</div>
            <div class="act">${act}</div>
        </div>`;
    }

    // Last N days as small cells, oldest → today. For weekday-only trackers the
    // strip shows scheduled days only, so weekends don't read as gaps.
    function strip(h, n = 10) {
        const cells = [];
        for (let i = 0, d = dayStart(new Date()); cells.length < n && i < 60; i++, d = addDays(d, -1)) {
            const k = localKey(d), today = i === 0;
            let c;
            if (h.type === 'build') {
                const s = buildDay(h, k);
                c = s === 'done' ? 'done' : s === 'skip' ? 'rest' : s === 'off' ? 'off' : '';
            } else {
                if (!isScheduled(h, d) && !(h.outcomes || {})[k]) continue;
                const s = discDay(h, k);
                c = s === 'open' ? '' : s;
            }
            cells.unshift(`<i class="${c}${today ? ' today' : ''}"></i>`);
        }
        return `<div class="strip" aria-hidden="true">${cells.join('')}</div>`;
    }

    function holdBtn(h) {
        return `<button class="hold" data-hold="checkin" data-action="hold" data-id="${h.id}" aria-label="Hold to check in ${esc(h.name)}">
            <svg width="48" height="48" viewBox="0 0 48 48"><circle class="trk" cx="24" cy="24" r="21" fill="none" stroke-width="3"/>
            <circle class="prog" cx="24" cy="24" r="21" fill="none" stroke-width="3" stroke-linecap="round" transform="rotate(-90 24 24)"/></svg>
            <span>✓</span></button>`;
    }

    function buildRow(h) {
        const streak = buildStreak(h), s = buildDay(h, todayKey()), left = skipsLeft(h);
        const sub = `<div class="sub"><b>${streak}</b> day streak · ${left ? left + ' skip left this week' : 'skip used this week'}</div>`;
        const act = s === 'done' ? `<div class="done-dot" aria-label="Done today">✓</div>`
                  : s === 'skip' ? `<span class="tag">Skipped</span>`
                  : holdBtn(h);
        return [sub + strip(h), act];
    }

    function discRow(h) {
        const streak = discStreak(h), adh = adherence(h, 30), today = (h.outcomes || {})[todayKey()];
        const sub = `<div class="sub"><b>${streak}</b> on plan${adh != null ? ` · ${adh}% (30d)` : ''}</div>`;
        let act;
        if (today === 'win') act = `<span class="tag win">✓ On plan</span>`;
        else if (today === 'loss') act = `<span class="tag loss">✕ Broke</span>`;
        else if (today === 'rest') act = `<span class="tag">No session</span>`;
        else if (isRestDay(h)) act = `<span class="tag">${h.preset === 'trading' ? 'Market closed' : 'Rest day'}</span>`;
        else act = `<button class="cb no" data-action="disc-loss" data-id="${h.id}" aria-label="Broke rules">✕</button>
                    <button class="cb ok" data-action="disc-win" data-id="${h.id}" aria-label="Followed rules">✓</button>`;
        const logged = today || isRestDay(h);
        return [sub + strip(h, logged ? 10 : 8), act];   // two buttons need the room
    }

    function quitRow(h) {
        const ms = quitMs(h), { clean, total } = cleanStats(h, 30);
        const pct = total ? clean / total * 100 : 100;
        const sub = `<div class="sub"><span class="big-sub" data-live="${h.id}:qclock">${fmtQuitClock(ms)}</span></div>
            <div class="sub">${clean} of ${total} days clean${(h.cravings || []).length ? ` · ${h.cravings.length} urges beaten` : ''}</div>
            <div class="cleanbar"><div style="width:${pct.toFixed(0)}%"></div></div>`;
        return [sub, `<button class="pill" data-action="craving" data-id="${h.id}">Hold</button>`];
    }

    function fastIdleRow(h) {
        const last = (h.fasts || [])[(h.fasts || []).length - 1];
        const sub = `<div class="sub">${last ? `Last <b>${(last.hours || 0).toFixed(1)}h</b> ${last.hit ? '· goal hit ✓' : 'of ' + last.goal + 'h'}` : 'No fasts yet'} · goal ${h.goalHours || 16}h</div>`;
        return [sub, `<button class="pill acc" data-action="fast-start" data-id="${h.id}">Start</button>`];
    }

    /* Active fast: a ring filling toward the goal, ticks at each stage boundary. */
    const RING_R = 58, RING_C = 2 * Math.PI * RING_R;
    function fastRing(h, size = 140) {
        const goal = h.goalHours || 16, hours = fastMs(h) / HOUR, pct = Math.min(1, hours / goal);
        const ticks = FAST_STAGES.filter(s => s[0] > 0 && s[0] < goal).map(s => {
            const a = s[0] / goal * 360;
            return `<line x1="70" y1="4" x2="70" y2="20" stroke="var(--card)" stroke-width="3" transform="rotate(${a.toFixed(1)} 70 70)"/>`;
        }).join('');
        return `<svg width="${size}" height="${size}" viewBox="0 0 140 140" aria-hidden="true">
            <circle cx="70" cy="70" r="${RING_R}" fill="none" stroke="var(--faint)" stroke-width="12"/>
            <circle data-live="${h.id}:ring" cx="70" cy="70" r="${RING_R}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="${(RING_C * pct).toFixed(1)} ${RING_C.toFixed(1)}" transform="rotate(-90 70 70)"/>
            ${ticks}</svg>`;
    }
    function fastLive(h) {   // the strings the tick keeps fresh
        const goal = h.goalHours || 16, ms = fastMs(h), hours = ms / HOUR;
        const left = goal * HOUR - ms;
        return {
            fclock: fmtFastClock(ms),
            fpct: `of ${goal}h · ${Math.min(999, Math.floor(hours / goal * 100))}%`,
            fleft: left > 0 ? `<b>${fmtDur(left)}</b> to go` : `<b>Goal reached</b> · +${fmtDur(-left)}`,
            fstage: FAST_STAGES[stageIdxAt(hours)][1] + ' ≈',
            ring: (RING_C * Math.min(1, hours / goal)).toFixed(1) + ' ' + RING_C.toFixed(1),
        };
    }
    function fastCard(h, inPage) {
        const accent = h.color || '#a371f7', L = fastLive(h), goal = h.goalHours || 16;
        const start = new Date(h.fastStart).getTime(), done = fastMs(h) >= goal * HOUR;
        return `<div class="fast" style="--accent:${accent}">
            <div class="fast-top" ${inPage ? '' : `data-action="open" data-id="${h.id}"`}>
                <div class="ringwrap">${fastRing(h)}
                    <div class="ringc"><div class="el" data-live="${h.id}:fclock">${L.fclock}</div><div class="lab" data-live="${h.id}:fpct">${L.fpct}</div></div></div>
                <div class="fi">
                    <div class="nm">${h.icon || '⏳'} ${esc(h.name)}</div>
                    <div class="stagechip" data-live="${h.id}:fstage">${esc(L.fstage)}</div>
                    <div class="kv">Started <b>${fmtDayTime(start)}</b><br>Goal <b>${fmtDayTime(start + goal * HOUR)}</b><br><span data-live="${h.id}:fleft">${L.fleft}</span></div>
                </div>
            </div>
            <div class="actions" style="margin-top:14px">
                <button class="btn btn-plain" data-action="fast-adjust" data-id="${h.id}">Adjust start</button>
                <button class="btn ${done ? 'btn-good' : 'btn-danger'}" data-action="fast-end" data-id="${h.id}" data-live-end="${h.id}">${done ? '✓ Finish fast' : 'End fast'}</button>
            </div>
        </div>`;
    }

    // Push the live strings into whatever is on screen (home rows, fast card, detail page).
    function setLive(id, field, html) {
        document.querySelectorAll(`[data-live="${id}:${field}"]`).forEach(el => {
            if (field === 'ring') el.setAttribute('stroke-dasharray', html);
            else if (el.innerHTML !== html) el.innerHTML = html;
        });
    }

    /* ============================================================
       LIVE TICK — update quit counters + milestone + reminders
       ============================================================ */
    let lastMinute = '', lastDay = todayKey();
    function tick() {
        let dirty = false;
        if (todayKey() !== lastDay) { lastDay = todayKey(); render(); }   // midnight: due lists reset
        for (const h of state.habits) {
            // active fasts: live ring/clock + stage-crossing + goal-hit (in-app path;
            // closed-app alerts are pre-scheduled by syncScheduledReminders)
            if (h.type === 'fast') {
                if (!h.fastStart) continue;
                const ms = fastMs(h), hours = ms / HOUR, L = fastLive(h);
                for (const f of ['fclock', 'fpct', 'fleft', 'fstage', 'ring']) setLive(h.id, f, L[f]);
                const idx = stageIdxAt(hours);
                if (h._lastStage == null) { h._lastStage = idx; dirty = true; }
                else if (idx > h._lastStage) {
                    h._lastStage = idx; dirty = true;
                    const st = FAST_STAGES[idx];
                    beep(660, 90); haptic(ImpactStyle.Medium);
                    toast(`≈${st[0]}h — ${st[1]}`);
                    notify(`${st[1]} (≈${st[0]}h)`, st[2]);
                }
                if (!h._goalHit && hours >= (h.goalHours || 16)) {
                    h._goalHit = true; dirty = true;
                    celebrate(h, (h.goalHours || 16) + 'h fast goal');
                    render();   // flip the End button to "Finish fast"
                }
                continue;
            }
            if (h.type !== 'quit') continue;
            const ms = quitMs(h);
            setLive(h.id, 'qclock', fmtQuitClock(ms));
            setLive(h.id, 'qdays', Math.floor(ms / DAY) + 'd');
            // milestone celebration
            const hitCount = achievedQuit(ms).length;
            if (h._lastMilestone == null) { h._lastMilestone = hitCount; dirty = true; } // baseline; don't fire retroactively
            else if (hitCount > h._lastMilestone) {
                h._lastMilestone = hitCount; dirty = true;
                const m = achievedQuit(ms)[hitCount - 1];
                celebrate(h, m ? m[1] : 'milestone');
            }
        }
        // reminders (checked once per minute)
        const now = new Date();
        const cur = localKey(now) + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        const hm = cur.slice(11);
        if (cur !== lastMinute) {
            lastMinute = cur;
            const isWeekend = now.getDay() === 0 || now.getDay() === 6;
            for (const h of state.habits) {
                if (!h.reminderTime || h.reminderTime !== hm) continue;
                if (h.reminderWeekdays && isWeekend) continue;
                if (h._lastReminder === todayKey()) continue;
                h._lastReminder = todayKey(); dirty = true;
                notify('PROTOCOL', reminderBody(h));
            }
        }
        if (dirty) save();
    }

    function celebrate(h, label) {
        beep(660, 90); setTimeout(() => beep(880, 140), 110);
        toast(`${h.name} — ${label}.`);
        notify(`Milestone: ${label}`, `"${h.name}" just hit ${label}. Keep it going.`);
        haptic(ImpactStyle.Heavy);
    }

    /* ============================================================
       ACTIONS
       ============================================================ */
    function relapse(id, prefill) {
        const h = state.habits.find(x => x.id === id); if (!h) return;
        openSheet(`
            <div class="sheet-grab"></div>
            <h2>Reset "${esc(h.name)}"?</h2>
            <p class="sub">This logs a relapse and restarts the clock from when it happened. Your best streak is kept.</p>
            <label class="f">When did it happen?</label>
            <input class="f" id="relapseAt" type="datetime-local" value="${nowLocal()}" min="${isoToLocal(h.startDate)}" max="${nowLocal()}">
            <label class="f">What happened? (optional)</label>
            <input class="f" id="relapseNote" value="${esc(prefill || '')}" placeholder="Trigger, mood, lesson...">
            <button class="save-btn" style="background:linear-gradient(135deg,#ff4d4d,#ff7a7a)" data-action="confirm-relapse" data-id="${id}">Yes, reset the streak</button>
            <button class="text-btn" data-action="close">Never mind — stay strong</button>
        `);
    }
    function confirmRelapse(id) {
        const h = state.habits.find(x => x.id === id); if (!h) return;
        const note = (document.getElementById('relapseNote') || {}).value || '';
        // Backdatable: "I slipped last night" shouldn't cost the hours since.
        // Must fall inside the current streak (not before it began, not in the future).
        const v = (document.getElementById('relapseAt') || {}).value;
        let at = v ? new Date(v).getTime() : Date.now();
        if (Number.isNaN(at)) at = Date.now();
        if (at > Date.now()) { toast('That time is in the future.'); return; }
        const start = new Date(h.startDate).getTime();
        if (at < Math.floor(start / MIN) * MIN) { toast('That is before this streak started.'); return; }
        at = Math.max(at, start);   // the picker has minute precision
        const iso = new Date(at).toISOString();
        h.relapses = h.relapses || [];
        h.relapses.push({ date: iso, note: note.trim() });
        h.startDate = iso;
        h._lastMilestone = achievedQuit(quitMs(h)).length;   // baseline: no retro celebrations
        save(); closeSheet(); render();
        toast(Date.now() - at < 5 * MIN ? 'Reset logged. Day one starts now.' : 'Reset logged from ' + new Date(at).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }) + '.');
        haptic(ImpactStyle.Medium);
        syncScheduledReminders();
    }

    /* ============================================================
       CRAVING — real-time urge-surf intervention (the panic button)
       Instead of just resetting, hit "Hold the line" the moment an urge
       strikes: breathe through it (4-7-8), see everything you'd throw away,
       and log a WIN. Every beaten urge is counted and preserved.
       ============================================================ */
    let cravingTimers = [], cravingStart = 0;

    function reasonsFor(h) {
        const custom = (h.reasons || []).filter(Boolean);
        if (custom.length) return custom;
        const p = presetByKey(h.preset || 'custom');
        return p && p.why ? [p.why] : [];
    }

    function openCraving(id) {
        const h = state.habits.find(x => x.id === id); if (!h || h.type !== 'quit') return;
        const ms = quitMs(h), beaten = (h.cravings || []).length;
        const stakes = [`<div class="m"><b>${ms >= DAY ? Math.floor(ms/DAY) + 'd' : Math.floor(ms/HOUR) + 'h'}</b><span>Clean</span></div>`];
        if (h.costPerDay) stakes.push(`<div class="m"><b>${fmtMoney(h.costPerDay * ms / DAY)}</b><span>Saved</span></div>`);
        if (h.hoursPerDay) stakes.push(`<div class="m"><b>${fmtHours(h.hoursPerDay * ms / DAY)}</b><span>Reclaimed</span></div>`);
        stakes.push(`<div class="m"><b>${beaten}</b><span>Urges Beat</span></div>`);

        const reasons = reasonsFor(h);
        const why = (h.plan ? `<div class="cr-why"><div class="t">Your plan</div><div style="font-size:.95rem;line-height:1.5">${esc(h.plan)}</div></div>` : '') +
            (reasons.length ? `<div class="cr-why"><div class="t">Why you started</div><ul>${reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>` : '');

        openFull(`
            <div class="craving" style="--accent:${h.color || '#58a6ff'}">
                <button class="cr-x" data-action="craving-close" aria-label="Close">✕</button>
                <div class="cr-head">Ride the wave</div>
                <div class="cr-sub">Urges peak and pass within minutes. Notice it, name it, breathe with the circle — you don't have to act on it.</div>
                <div class="cr-orb-wrap"><div class="cr-orb" id="crOrb"><span class="cr-label" id="crLabel">Breathe in</span></div></div>
                <div class="seg" role="group" aria-label="Breathing pattern">${Object.entries(BREATHS).map(([k, b]) =>
                    `<button type="button" class="${breathKey() === k ? 'sel' : ''}" data-action="breath" data-breath="${k}">${b.name}</button>`).join('')}</div>
                <div class="cr-timer" id="crTimer" style="margin-top:10px">0:00 <span>holding strong</span></div>
                <div class="cr-stakes">${stakes.join('')}</div>
                ${why}
                <div class="cr-spacer"></div>
                <input class="f" id="crTrigger" placeholder="What set it off? (optional)" style="margin-top:16px">
                <button class="cr-beat" data-action="craving-beat" data-id="${id}" style="margin-top:12px">I beat it</button>
                <button class="text-btn" data-action="craving-slip" data-id="${id}" style="color:var(--danger)">I slipped…</button>
            </div>
        `);
        startBreathing();
        startCravingTimer();
        haptic(ImpactStyle.Medium);
    }

    /* Breathing patterns. Default: cyclic sighing (two inhales, long exhale) —
       in a 28-day RCT (Balban et al., 2023) it improved mood more than box
       breathing or mindfulness. 4-7-8 stays available for anyone who prefers it. */
    const BREATHS = {
        sigh: { name: 'Cyclic sigh', phases: [['Breathe in', 2, 1.3], ['Top up', 1, 1.42], ['Long breath out', 6, 1]] },
        f478: { name: '4-7-8', phases: [['Breathe in', 4, 1.42], ['Hold', 7, 1.42], ['Breathe out', 8, 1]] },
    };
    const breathKey = () => BREATHS[state.settings.breath] ? state.settings.breath : 'sigh';
    let breathTimers = [];
    function startBreathing() {
        breathTimers.forEach(clearTimeout); breathTimers = [];
        const phases = BREATHS[breathKey()].phases;
        let i = 0;
        (function step() {
            const orb = document.getElementById('crOrb'), lab = document.getElementById('crLabel');
            if (!orb || !lab) return;                 // screen closed — stop looping
            const [text, secs, scale] = phases[i];
            lab.textContent = text;
            orb.style.transitionDuration = secs + 's';
            orb.style.transform = 'scale(' + scale + ')';
            i = (i + 1) % phases.length;
            breathTimers.push(setTimeout(step, secs * 1000));
        })();
    }
    function setBreath(k) {
        if (!BREATHS[k]) return;
        state.settings.breath = k; save();
        document.querySelectorAll('[data-action="breath"]').forEach(b => b.classList.toggle('sel', b.dataset.breath === k));
        startBreathing();
    }

    function startCravingTimer() {
        cravingStart = Date.now();
        cravingTimers.push(setInterval(() => {
            const el = document.getElementById('crTimer'); if (!el) return;
            const s = Math.floor((Date.now() - cravingStart) / 1000);
            el.innerHTML = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' <span>holding strong</span>';
        }, 1000));
    }

    function stopCraving() {
        breathTimers.forEach(clearTimeout); breathTimers = [];
        cravingTimers.forEach(t => { clearTimeout(t); clearInterval(t); });
        cravingTimers = []; cravingStart = 0;
    }

    function beatCraving(id) {
        const h = state.habits.find(x => x.id === id); if (!h) return;
        const trigger = ((document.getElementById('crTrigger') || {}).value || '').trim();
        const held = cravingStart ? Math.floor((Date.now() - cravingStart) / 1000) : 0;
        h.cravings = h.cravings || [];
        h.cravings.push({ date: new Date().toISOString(), outcome: 'beat', trigger, held });
        stopCraving(); closeFull(); save(); render();
        const n = h.cravings.length;
        beep(660, 90); setTimeout(() => beep(880, 150), 120);
        haptic(ImpactStyle.Heavy);
        toast(`Urge beaten — ${n} total. Streak intact.`);
    }

    function cravingSlip(id) {
        const trigger = ((document.getElementById('crTrigger') || {}).value || '').trim();
        stopCraving(); closeFull();
        relapse(id, trigger);   // fall into the normal reset flow, trigger prefilled
    }

    function checkIn(id) {
        const h = state.habits.find(x => x.id === id); if (!h) return;
        h.checkIns = h.checkIns || [];
        const k = todayKey();
        if (!h.checkIns.includes(k)) h.checkIns.push(k);
        h.skips = (h.skips || []).filter(x => x !== k);
        const streak = buildStreak(h);
        save(); render();
        beep(720, 80); haptic(ImpactStyle.Medium);
        if (BUILD_DAYS.includes(streak)) celebrate(h, streak + ' days');
        else toast('✓ Checked in. Streak: ' + streak);
    }
    function uncheck(id) {
        const h = state.habits.find(x => x.id === id); if (!h) return;
        const k = todayKey();
        h.checkIns = (h.checkIns || []).filter(x => x !== k);
        save(); render();
    }

    /* ---------- Discipline ('disc') logging — win/loss per day, overwrite allowed ---------- */
    function discWin(id) {
        const h = state.habits.find(x => x.id === id); if (!h) return;
        const k = todayKey();
        h.outcomes = h.outcomes || {};
        const prev = h.outcomes[k];
        if (prev === 'win') { toast('Already logged — on plan today.'); return; }   // no re-celebrate spam
        h.outcomes[k] = 'win';
        if (h.lossNotes) delete h.lossNotes[k];   // switched loss -> win: drop the stale note
        const streak = discStreak(h);
        save(); render();
        beep(720, 80); haptic(ImpactStyle.Medium);
        if (prev == null && BUILD_DAYS.includes(streak)) celebrate(h, streak + ' disciplined days');
        else toast(prev === 'loss' ? '✓ Changed to a win. Streak: ' + streak : '✓ Rules followed. Streak: ' + streak);
    }
    function discLoss(id) {
        const h = state.habits.find(x => x.id === id); if (!h) return;
        openSheet(`
            <div class="sheet-grab"></div>
            <h2>Broke the rules?</h2>
            <p class="sub">Logging it is the discipline. Name what pulled you in — patterns show up fast.</p>
            <label class="f">What happened? (optional)</label>
            <input class="f" id="discNote" placeholder="Chased the 1m, moved my stop, FOMO entry...">
            <button class="save-btn" style="background:linear-gradient(135deg,#ff4d4d,#ff7a7a)" data-action="confirm-disc-loss" data-id="${id}">Log it — tomorrow I trade the plan</button>
            <button class="text-btn" data-action="disc-rest" data-id="${id}">No session today instead (doesn't count either way)</button>
            <button class="text-btn" data-action="close">Cancel</button>
        `);
    }
    function discRest(id) {
        const h = state.habits.find(x => x.id === id); if (!h) return;
        const k = todayKey();
        h.outcomes = h.outcomes || {};
        h.outcomes[k] = 'rest';
        if (h.lossNotes) delete h.lossNotes[k];
        save(); closeSheet(); render(); haptic(ImpactStyle.Light);
        toast('Logged: no session today. Streak unaffected.');
    }
    function confirmDiscLoss(id) {
        const h = state.habits.find(x => x.id === id); if (!h) return;
        const k = todayKey();
        const note = ((document.getElementById('discNote') || {}).value || '').trim();
        h.outcomes = h.outcomes || {};
        h.outcomes[k] = 'loss';
        if (note) { h.lossNotes = h.lossNotes || {}; h.lossNotes[k] = note; }
        save(); closeSheet(); render();
        haptic(ImpactStyle.Medium);
        toast('Logged. The log is the win — tomorrow, trade the plan. 📈');
    }

    /* ---------- Fasting ('fast') lifecycle ---------- */
    function setFastGoal(id, hours) {
        const h = state.habits.find(x => x.id === id); if (!h || h.fastStart) return;   // locked while a fast runs
        h.goalHours = hours;
        save(); render(); haptic(ImpactStyle.Light);
    }
    function startFast(id) {
        const h = state.habits.find(x => x.id === id); if (!h || h.fastStart) return;
        h.goalHours = h.goalHours || 16;
        h.fastStart = new Date().toISOString();
        h._lastStage = 0; h._goalHit = false;
        save(); render();
        beep(720, 80); haptic(ImpactStyle.Medium);
        toast(`Fast started — ${h.goalHours}h goal. Water and electrolytes are your friends.`);
        maybeAskNotifications();
        syncScheduledReminders();   // pre-schedule the stage alerts with the OS
    }
    function endFast(id) {
        const h = state.habits.find(x => x.id === id); if (!h || !h.fastStart) return;
        const hours = fastMs(h) / HOUR, goal = h.goalHours || 16;
        if (hours >= goal) { finishFast(id); return; }
        const st = FAST_STAGES[stageIdxAt(hours)];
        openSheet(`
            <div class="sheet-grab"></div>
            <h2>End at ${hours.toFixed(1)}h?</h2>
            <p class="sub">You're in <b>${esc(st[1])}</b>, ${(goal - hours).toFixed(1)}h short of the ${goal}h goal. Hunger passes in waves — or log it and come back stronger.</p>
            <button class="save-btn" style="background:var(--card2);color:var(--text);border:1px solid var(--line)" data-action="close">Keep fasting</button>
            <button class="text-btn del" data-action="confirm-fast-end" data-id="${id}">End now &amp; log ${hours.toFixed(1)}h</button>
        `);
    }
    /* Backdate an active fast — "I actually started at dinner, hours ago."
       Chips shift the start back from NOW; the picker allows any past moment. */
    function adjustFastStart(id) {
        const h = state.habits.find(x => x.id === id); if (!h || !h.fastStart) return;
        openSheet(`
            <div class="sheet-grab"></div>
            <h2>When did the fast really start?</h2>
            <p class="sub">Your fast is timed from your last meal — set it back to when you actually stopped eating.</p>
            <div class="goalchips" style="--accent:${h.color || '#a371f7'}">
                ${[[30,'30m ago'],[60,'1h ago'],[120,'2h ago'],[240,'4h ago'],[480,'8h ago']].map(([m,l]) =>
                    `<button type="button" class="chip" data-action="fa-chip" data-mins="${m}">${l}</button>`).join('')}
            </div>
            <label class="f" style="margin-top:14px">Exact start</label>
            <input class="f" id="faStart" type="datetime-local" value="${isoToLocal(h.fastStart)}" max="${nowLocal()}">
            <button class="save-btn" data-action="confirm-fast-adjust" data-id="${id}">Save start time</button>
            <button class="text-btn" data-action="close">Cancel</button>
        `);
    }
    function confirmFastAdjust(id) {
        const h = state.habits.find(x => x.id === id); if (!h || !h.fastStart) return;
        const v = (document.getElementById('faStart') || {}).value;
        const t = v ? new Date(v).getTime() : NaN;
        if (!v || Number.isNaN(t)) { toast('Pick a valid start time.'); return; }
        if (t > Date.now()) { toast('Start time can\'t be in the future.'); return; }
        h.fastStart = new Date(t).toISOString();
        // Rebaseline silently: no toast storm for stages crossed hours ago, no
        // retro-celebration if the corrected start already clears the goal.
        const hours = fastMs(h) / HOUR;
        h._lastStage = stageIdxAt(hours);
        h._goalHit = hours >= (h.goalHours || 16);
        save(); closeSheet(); render();
        haptic(ImpactStyle.Medium);
        const st = FAST_STAGES[stageIdxAt(hours)];
        toast(`Start adjusted — ${hours.toFixed(1)}h in. ${st[1]}.`);
        syncScheduledReminders();   // stage alerts re-derive from the corrected start
    }

    function finishFast(id) {
        const h = state.habits.find(x => x.id === id); if (!h || !h.fastStart) return;
        const end = new Date().toISOString();
        const hours = Math.round(fastMs(h) / HOUR * 10) / 10;
        const goal = h.goalHours || 16;
        h.fasts = h.fasts || [];
        h.fasts.push({ start: h.fastStart, end, hours, goal, hit: hours >= goal });
        h.fastStart = null; h._lastStage = null; h._goalHit = false;
        save(); closeSheet(); render();
        haptic(ImpactStyle.Heavy);
        if (hours >= goal) { beep(660, 90); setTimeout(() => beep(880, 150), 120); toast(`${goal}h fast complete — logged ${hours}h. Break it gently.`); }
        else toast(`Logged ${hours}h of ${goal}h. Every logged fast counts.`);
        syncScheduledReminders();   // drop the now-stale stage alerts
    }

    function deleteHabit(id) {
        state.habits = state.habits.filter(x => x.id !== id);
        save(); closeSheet(); render();
        toast('Tracker deleted.');
        syncScheduledReminders();
    }

    /* ============================================================
       ADD / EDIT FORM
       ============================================================ */
    let draft = null;

    function openForm(habit) {
        if (habit) {
            draft = { ...habit, editing: true };
            if (habit.startDate) draft.startLocal = isoToLocal(habit.startDate);
            draft.reasonsText = (habit.reasons || []).join('\n');
        } else {
            const p = presetByKey('custom');
            draft = { preset: 'custom', name: '', icon: p.icon, color: p.color, type: p.type, cat: p.cat,
                      goalDays: '', goalHours: 16, costPerDay: '', hoursPerDay: '', reminderTime: '', reasonsText: '', startNow: true };
        }
        renderForm();
    }
    function selectPreset(key) {
        syncDraftFromInputs();                  // keep any goal/cost/hours/reminder already typed
        const p = presetByKey(key);
        draft.preset = key;
        if (p.name !== 'Custom') draft.name = p.name;   // a preset fills the name; Custom keeps yours
        draft.icon = p.icon; draft.color = p.color; draft.type = p.type; draft.cat = p.cat;
        // Preset reminder defaults (e.g. Trading Rules nudges 09:00 weekdays). Values a
        // previous preset injected are cleared when browsing on; user-entered ones are kept.
        if (draft._presetRemind && draft.reminderTime === draft._presetRemind && !p.remind) draft.reminderTime = '';
        if (draft._presetWeekdays && !p.weekdays) draft.reminderWeekdays = false;
        if (p.remind && !draft.reminderTime) { draft.reminderTime = p.remind; draft._presetRemind = p.remind; }
        draft._presetWeekdays = !!p.weekdays;
        if (p.weekdays) draft.reminderWeekdays = true;
        renderForm();                           // render WITHOUT re-reading inputs, so preset values stick
    }
    function renderForm(keepValues) {
        if (keepValues) syncDraftFromInputs();
        const isBuild = draft.type === 'build';
        const isDisc = draft.type === 'disc';
        const isFast = draft.type === 'fast';
        const isQuit = !isBuild && !isDisc && !isFast;
        const html = `
            <div class="sheet-grab"></div>
            <h2>${draft.editing ? 'Edit tracker' : 'New tracker'}</h2>
            <p class="sub">${draft.editing ? 'Update the details below.' : 'Pick a starting point or go custom.'}</p>

            ${draft.editing ? '' : `
            <label class="f">Quick start</label>
            <div class="preset-grid">
                ${PRESETS.map(p => `<div class="preset ${draft.preset===p.key?'sel':''}" data-action="select-preset" data-preset="${p.key}">
                    <div class="pi">${p.icon}</div><div class="pn">${esc(p.name)}</div></div>`).join('')}
            </div>`}

            <label class="f">Name</label>
            <input class="f" id="fName" value="${esc(draft.name)}" placeholder="e.g. No Weed">

            <div class="row2">
                <div>
                    <label class="f">Emoji</label>
                    <input class="f" id="fIcon" value="${esc(draft.icon)}" style="text-align:center;font-size:1.4rem">
                </div>
                <div></div>
            </div>
            <label class="f">Color</label>
            <div class="swatches">${(PALETTE.includes(draft.color) ? PALETTE : [draft.color, ...PALETTE]).map(c =>
                `<button type="button" class="sw ${c === draft.color ? 'sel' : ''}" style="background:${esc(c)}" data-action="set-color" data-color="${esc(c)}" aria-label="Color ${esc(c)}"></button>`).join('')}</div>

            <label class="f">Type</label>
            <div class="type-toggle">
                <div class="type-opt ${isQuit?'sel':''}" data-action="set-type" data-type="quit">QUIT<small>Time since last slip</small></div>
                <div class="type-opt ${isBuild?'sel':''}" data-action="set-type" data-type="build">BUILD<small>Daily check-in streak</small></div>
                <div class="type-opt ${isDisc?'sel':''}" data-action="set-type" data-type="disc">RULES<small>Daily win / loss log</small></div>
                <div class="type-opt ${isFast?'sel':''}" data-action="set-type" data-type="fast">FAST<small>Timed fasting sessions</small></div>
            </div>

            ${isFast ? `
            <label class="f">Default fast goal</label>
            <div class="goalchips" style="--accent:${draft.color || '#a371f7'}">
                ${FAST_GOALS.map(g => `<button type="button" class="chip ${(parseInt(draft.goalHours) || 16) === g.h ? 'sel' : ''}" data-action="form-goal-hours" data-hours="${g.h}">${g.h}h</button>`).join('')}
            </div>
            <div class="stageline">${esc((FAST_GOALS.find(g => g.h === (parseInt(draft.goalHours) || 16)) || FAST_GOALS[0]).desc)}</div>
            ` : `
            <label class="f">Goal — target days (optional)</label>
            <input class="f" id="fGoal" type="number" inputmode="numeric" value="${esc(draft.goalDays)}" placeholder="e.g. 30, 90, 365">`}

            ${!isQuit ? '' : `
            <div class="row2">
                <div>
                    <label class="f">$ per day (optional)</label>
                    <input class="f" id="fCost" type="number" inputmode="decimal" value="${esc(draft.costPerDay)}" placeholder="money saved">
                </div>
                <div>
                    <label class="f">Hours/day (optional)</label>
                    <input class="f" id="fHours" type="number" inputmode="decimal" value="${esc(draft.hoursPerDay)}" placeholder="time reclaimed">
                </div>
            </div>
            <label class="f">When did this streak start?</label>
            <input class="f" id="fStart" type="datetime-local" value="${draft.startLocal || nowLocal()}">
            <label class="f">If-then plan for your top trigger (optional)</label>
            <textarea class="f" id="fPlan" rows="2" placeholder="If I want a coffee after 2pm, then I drink sparkling water and walk for 5 minutes.">${esc(draft.plan || '')}</textarea>`}

            <label class="f">Daily reminder (optional)</label>
            <input class="f" id="fReminder" type="time" value="${esc(draft.reminderTime)}">
            <label class="wk-row"><input type="checkbox" id="fWeekdays" ${draft.reminderWeekdays ? 'checked' : ''}> Weekdays only (Mon–Fri)</label>

            <label class="f">Your why — reasons to stay strong (optional, one per line)</label>
            <textarea class="f" id="fReasons" rows="3" placeholder="Be present for my kids&#10;Save $300 a month&#10;Sleep better, think clearer">${esc(draft.reasonsText || '')}</textarea>

            <button class="save-btn" data-action="save-habit">${draft.editing ? 'Save changes' : 'Start tracking'}</button>
            ${draft.editing ? `<button class="text-btn del" data-action="delete" data-id="${draft.id}">Delete this tracker</button>` : ''}
            <button class="text-btn" data-action="close">Cancel</button>
        `;
        openSheet(html);
    }
    // One emoji as the user sees it — keeps ZWJ sequences like 🧔‍♂️ whole
    // (the old maxlength="2" cut them to a broken half).
    function firstGrapheme(s) {
        s = String(s || '').trim();
        if (!s) return '';
        try {
            if (typeof Intl !== 'undefined' && Intl.Segmenter) {
                const first = new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(s)[Symbol.iterator]().next();
                if (!first.done) return first.value.segment;
            }
        } catch (e) {}
        return Array.from(s)[0];
    }
    function nowLocal() { return isoToLocal(new Date().toISOString()); }
    function isoToLocal(iso) {
        const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 16);
    }
    function syncDraftFromInputs() {
        const g = id => (document.getElementById(id) || {}).value;
        if (g('fName') != null) draft.name = g('fName');
        if (g('fIcon') != null) draft.icon = g('fIcon');
        if (g('fColor') != null) draft.color = g('fColor');
        if (g('fGoal') != null) draft.goalDays = g('fGoal');
        if (g('fCost') != null) draft.costPerDay = g('fCost');
        if (g('fHours') != null) draft.hoursPerDay = g('fHours');
        if (g('fReminder') != null) draft.reminderTime = g('fReminder');
        const wk = document.getElementById('fWeekdays');
        if (wk) draft.reminderWeekdays = wk.checked;
        if (g('fReasons') != null) draft.reasonsText = g('fReasons');
        if (g('fStart') != null) draft.startLocal = g('fStart');
        if (g('fPlan') != null) draft.plan = g('fPlan');
    }
    function setType(t) { syncDraftFromInputs(); draft.type = t; renderForm(); }
    function setFormGoalHours(hrs) { syncDraftFromInputs(); draft.goalHours = hrs; renderForm(); }

    function saveHabit() {
        syncDraftFromInputs();
        const name = (draft.name || '').trim();
        if (!name) { toast('Give it a name first.'); return; }
        const common = {
            name, icon: firstGrapheme(draft.icon) || '⭐', color: draft.color || '#58a6ff',
            type: draft.type, cat: draft.cat || 'Custom', preset: draft.preset || (draft.editing ? draft.preset : 'custom'),
            goalDays: parseInt(draft.goalDays) || 0,
            goalHours: parseInt(draft.goalHours) || 16,
            costPerDay: parseFloat(draft.costPerDay) || 0,
            hoursPerDay: parseFloat(draft.hoursPerDay) || 0,
            reminderTime: draft.reminderTime || '',
            reminderWeekdays: !!draft.reminderWeekdays,
            reasons: (draft.reasonsText || '').split('\n').map(s => s.trim()).filter(Boolean),
            plan: (draft.plan || '').trim()
        };
        if (draft.editing) {
            const h = state.habits.find(x => x.id === draft.id);
            Object.assign(h, common);
            if (h.type === 'quit' && draft.startLocal) {
                h.startDate = new Date(draft.startLocal).toISOString();
                h._lastMilestone = achievedQuit(quitMs(h)).length; // rebaseline, don't spam past milestones
            }
        } else {
            const startDate = (draft.type !== 'build' && draft.startLocal)
                ? new Date(draft.startLocal).toISOString() : new Date().toISOString();
            state.habits.push({
                id: uid(), createdDate: startDate, startDate,
                relapses: [], checkIns: [], skips: [], outcomes: {}, fasts: [], fastStart: null, gapsFrom: todayKey(),
                _lastMilestone: 0, ...common
            });
        }
        // If they set a daily reminder, turn notifications on so it actually fires.
        if (common.reminderTime && !state.settings.notifications) state.settings.notifications = true;
        save(); closeSheet(); render();
        toast(draft.editing ? 'Saved.' : 'Tracking started.');
        maybeAskNotifications();
        syncScheduledReminders();
    }

    /* ============================================================
       DETAIL PAGE — pushed full screen from a row. History first:
       heatmap (tap any day to edit), weekday breakdown, notes/triggers,
       fasting chart + log; then timeline, milestones and tips (collapsed).
       ============================================================ */
    let pageId = null;
    const pageEl = () => document.getElementById('page');
    function openPage(id) {
        if (!state.habits.find(x => x.id === id)) return;
        pageId = id;
        renderPage();
        const p = pageEl(); p.hidden = false; p.scrollTop = 0;
        document.body.style.overflow = 'hidden';
    }
    function closePage() {
        pageId = null;
        const p = pageEl(); p.hidden = true; p.innerHTML = '';
        document.body.style.overflow = '';
        renderHome();
    }
    function typeLabel(h) {
        return h.type === 'build' ? 'Build habit' : h.type === 'disc' ? 'Rules log' : h.type === 'fast' ? 'Fasting' : 'Quit';
    }

    function renderPage() {
        const h = state.habits.find(x => x.id === pageId);
        if (!h) { closePage(); return; }
        const p = presetByKey(h.preset || 'custom');
        const meta = [esc(h.cat || 'Custom'), typeLabel(h)];
        if (h.reminderTime) meta.push('reminder ' + esc(h.reminderTime) + (h.reminderWeekdays ? ' weekdays' : ''));
        let body = '';
        if (h.type === 'build') body = buildPage(h);
        else if (h.type === 'disc') body = discPage(h);
        else if (h.type === 'fast') body = fastPage(h);
        else body = quitPage(h);

        // reference material, collapsed so history stays on top
        let more = '';
        const reasons = reasonsFor(h);
        if (reasons.length) more += `<div class="why">${reasons.map(esc).join(' · ')}</div>`;
