<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fight Club">
    <meta name="theme-color" content="#000000">
    <meta name="format-detection" content="telephone=no">
    <title>Fight Club - Workout Timer</title>
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --accent: #ff3b30;
            --accent-light: #ff6b6b;
            --accent-glow: rgba(255, 59, 48, 0.35);
            --success: #34c759;
            --bg-primary: #000000;
            --bg-card: rgba(28, 28, 30, 0.85);
            --bg-inset: rgba(0, 0, 0, 0.3);
            --text-primary: #ffffff;
            --text-secondary: rgba(235, 235, 245, 0.6);
            --text-tertiary: rgba(235, 235, 245, 0.3);
            --separator: rgba(84, 84, 88, 0.5);
            --hairline: rgba(255, 255, 255, 0.08);
            --blur: saturate(180%) blur(20px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overscroll-behavior-y: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            padding: calc(var(--safe-top) + 8px) calc(var(--safe-right) + 16px) calc(var(--safe-bottom) + 24px) calc(var(--safe-left) + 16px);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            letter-spacing: -0.01em;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at top right, rgba(255, 59, 48, 0.07) 0%, transparent 45%),
                radial-gradient(ellipse at bottom left, rgba(255, 107, 107, 0.04) 0%, transparent 45%),
                #000;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
            padding: 6px 0 0 0;
            position: relative;
        }

        .settings-btn {
            position: absolute;
            right: -4px;
            top: 6px;
            background: rgba(44, 44, 46, 0.7);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.25rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: transform 0.15s ease, background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:active {
            transform: scale(0.9);
            background: rgba(60, 60, 62, 0.9);
        }

        .header h1 {
            font-size: 2.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff3b30 0%, #ff6b6b 60%, #ff8787 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .progress-bar {
            background: rgba(60, 60, 62, 0.5);
            border-radius: 10px;
            height: 4px;
            margin: 12px auto 0 auto;
            max-width: 180px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 100%);
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .program-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-bottom: 8px;
            padding: 4px;
            background: var(--bg-inset);
            border-radius: 12px;
            border: 0.5px solid var(--hairline);
        }

        .program-btn {
            padding: 9px 4px;
            background: transparent;
            border: none;
            border-radius: 9px;
            color: var(--text-tertiary);
            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: -0.1px;
            min-height: 38px;
        }

        .program-btn:active {
            transform: scale(0.95);
        }

        .program-btn.active {
            background: rgba(58, 58, 60, 0.9);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .day-selector {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 20px;
            padding: 5px;
            background: var(--bg-card);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 14px;
            border: 0.5px solid var(--hairline);
        }

        .day-btn {
            padding: 12px 2px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
            font-weight: 600;
            font-size: 0.72rem;
            letter-spacing: 0.3px;
            position: relative;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .day-btn span {
            position: relative;
            z-index: 1;
        }

        .day-btn:active {
            transform: scale(0.92);
        }

        .day-btn.active {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: #fff;
            font-weight: 700;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .day-btn.completed {
            color: var(--success);
        }

        .day-btn.completed.active {
            color: #fff;
        }

        .day-btn.completed::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--success);
        }

        .day-btn.completed.active::after {
            background: #fff;
        }

        .workout-title {
            font-size: 1.7rem;
            font-weight: 800;
            margin-bottom: 3px;
            color: var(--text-primary);
            letter-spacing: -0.7px;
            line-height: 1.1;
        }

        .workout-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 500;
        }

        .timer-section {
            background: var(--bg-card);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 22px;
            padding: 18px 14px;
            margin-bottom: 16px;
            border: 0.5px solid var(--hairline);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        }

        .phase-indicator {
            text-align: center;
            font-size: 0.7rem;
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .phase-indicator #currentPhase {
            color: var(--accent-light);
        }

        .current-exercise-display {
            text-align: center;
            margin-bottom: 16px;
            padding: 16px 14px;
            background: linear-gradient(165deg, rgba(255, 59, 48, 0.12) 0%, rgba(255, 107, 107, 0.05) 100%);
            border-radius: 16px;
            border: 0.5px solid rgba(255, 59, 48, 0.25);
            animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .exercise-progress {
            display: inline-block;
            font-size: 0.62rem;
            color: var(--accent-light);
            text-transform: uppercase;
            letter-spacing: 1.6px;
            margin-bottom: 8px;
            font-weight: 700;
            padding: 4px 10px;
            background: rgba(255, 59, 48, 0.15);
            border-radius: 100px;
        }

        .current-exercise-name {
            font-size: 1.55rem;
            font-weight: 800;
            margin-bottom: 5px;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            line-height: 1.15;
        }

        .current-exercise-details {
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.4;
            font-weight: 500;
        }

        .next-up-display {
            margin-top: 12px;
            padding: 9px 12px;
            background: var(--bg-inset);
            border-radius: 11px;
            border: 0.5px solid var(--hairline);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .next-up-label {
            font-size: 0.62rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 1.4px;
            font-weight: 700;
        }

        .next-up-name {
            font-size: 0.86rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .exercise-tracker {
            margin-top: 14px;
            text-align: center;
        }

        .tracker-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 9px;
            flex-wrap: wrap;
            padding: 9px 14px;
            background: var(--bg-inset);
            border-radius: 100px;
            width: fit-content;
            margin: 0 auto;
        }

        .tracker-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), background 0.25s ease;
            cursor: pointer;
            position: relative;
        }

        .tracker-dot::before {
            content: '';
            position: absolute;
            inset: -8px;
        }

        .tracker-dot.active {
            background: var(--accent-light);
            box-shadow: 0 0 10px var(--accent-glow);
            transform: scale(1.45);
        }

        .tracker-dot.completed {
            background: var(--success);
        }

        .tracker-dot.completed.active {
            background: var(--accent-light);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-6px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .collapsible-section {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .collapse-btn {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-card);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 0.5px solid var(--hairline);
            border-radius: 14px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: transform 0.12s ease, background 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: -0.2px;
        }

        .collapse-btn:active {
            transform: scale(0.98);
            background: rgba(44, 44, 46, 0.95);
        }

        .collapse-btn span:last-child {
            color: var(--text-tertiary);
            font-size: 0.7rem;
        }

        .collapse-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .collapse-content.expanded {
            max-height: 2000px;
        }

        .timer-display-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0 16px 0;
        }

        .circular-timer {
            position: relative;
            width: 240px;
            height: 240px;
        }

        .circular-timer svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .circular-timer-bg {
            fill: none;
            stroke: rgba(60, 60, 62, 0.5);
            stroke-width: 7;
        }

        .circular-timer-progress {
            fill: none;
            stroke-width: 7;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.95s linear;
            filter: drop-shadow(0 0 8px currentColor);
        }

        .circular-timer-progress.work {
            stroke: var(--accent);
        }

        .circular-timer-progress.rest {
            stroke: var(--success);
        }

        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.3rem;
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            text-align: center;
            letter-spacing: -2px;
            line-height: 1;
        }

        .timer-display.work {
            color: var(--accent-light);
            text-shadow: 0 0 28px rgba(255, 59, 48, 0.45);
        }

        .timer-display.rest {
            color: var(--success);
            text-shadow: 0 0 28px rgba(52, 199, 89, 0.45);
        }

        .timer-display-label {
            font-size: 0.62rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 9px;
            font-weight: 700;
        }

        .timer-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .timer-btn {
            padding: 14px 10px;
            background: rgba(44, 44, 46, 0.85);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            border-radius: 13px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: transform 0.12s ease, background 0.2s ease;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: -0.2px;
        }

        .timer-btn span {
            position: relative;
            z-index: 1;
        }

        .timer-btn:active {
            transform: scale(0.94);
            background: rgba(58, 58, 60, 0.95);
        }

        .timer-btn.full {
            grid-column: 1 / -1;
            width: 100%;
        }

        .timer-btn.half {
            grid-column: span 2;
        }

        .timer-btn.primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            border: none;
            box-shadow: 0 6px 16px var(--accent-glow);
            font-weight: 700;
        }

        .timer-btn.primary:active {
            box-shadow: 0 3px 8px var(--accent-glow);
        }

        .section-title {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            color: var(--text-tertiary);
            margin: 18px 0 10px 0;
            font-weight: 700;
        }

        .exercise-list {
            display: grid;
            gap: 0;
            padding: 6px;
            background: var(--bg-card);
            border-radius: 14px;
            border: 0.5px solid var(--hairline);
        }

        .exercise-item {
            background: transparent;
            border: none;
            border-radius: 10px;
            padding: 12px 12px;
            transition: background 0.2s ease;
            position: relative;
        }

        .exercise-item + .exercise-item {
            border-top: 0.5px solid var(--hairline);
        }

        .exercise-item.active {
            background: rgba(255, 59, 48, 0.12);
            border-radius: 10px;
        }

        .exercise-item.completed {
            opacity: 0.4;
        }

        .exercise-item.completed .exercise-name {
            text-decoration: line-through;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .exercise-name {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 2px;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .exercise-details {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.35;
        }

        .exercise-checkbox {
            width: 26px;
            height: 26px;
            min-width: 26px;
            min-height: 26px;
            cursor: pointer;
            flex-shrink: 0;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 50%;
            border: 1.5px solid var(--separator);
            background: transparent;
            position: relative;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
        }

        .exercise-checkbox:checked {
            background: var(--success);
            border-color: var(--success);
        }

        .exercise-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%) rotate(45deg);
            width: 6px;
            height: 11px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
        }

        .exercise-checkbox:active {
            transform: scale(0.9);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 0.5px solid var(--separator);
        }

        .stat {
            text-align: center;
            padding: 15px 8px;
            background: var(--bg-card);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 15px;
            border: 0.5px solid var(--hairline);
        }

        .stat-number {
            font-size: 1.85rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.62rem;
            color: var(--text-tertiary);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
        }

        .rest-day {
            text-align: center;
            padding: 38px 18px;
            background: var(--bg-card);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 22px;
            border: 0.5px solid var(--hairline);
        }

        .rest-day h2 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: var(--success);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .warmup-list {
            font-size: 0.86rem;
            color: var(--text-secondary);
            line-height: 1.6;
            padding: 13px 15px;
            background: var(--bg-inset);
            border-radius: 12px;
            border: 0.5px solid var(--hairline);
        }

        .warmup-list p {
            margin: 7px 0;
            padding-left: 16px;
            position: relative;
        }

        .warmup-list p::before {
            content: '';
            position: absolute;
            left: 2px;
            top: 0.55em;
            width: 5px;
            height: 5px;
            background: var(--accent-light);
            border-radius: 50%;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(36, 36, 38, 0.98);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 26px 26px 0 0;
            padding: 24px 20px calc(var(--safe-bottom) + 24px) 20px;
            max-width: 500px;
            width: 100%;
            border-top: 0.5px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
            animation: slideUpSheet 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            max-height: 85vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 4px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0 18px 0;
        }

        .modal-title {
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .close-btn {
            background: rgba(120, 120, 128, 0.32);
            border: none;
            color: var(--text-secondary);
            font-size: 1.05rem;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
            font-weight: 600;
        }

        .close-btn:active {
            transform: scale(0.9);
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 15px;
            background: rgba(58, 58, 60, 0.45);
            margin-bottom: 2px;
        }

        .setting-item:first-of-type {
            border-radius: 12px 12px 0 0;
        }

        .setting-item:last-of-type {
            border-radius: 0 0 12px 12px;
        }

        .setting-label {
            font-size: 0.95rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .toggle-switch {
            position: relative;
            width: 51px;
            height: 31px;
            background: rgba(120, 120, 128, 0.32);
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.25s ease;
            flex-shrink: 0;
        }

        .toggle-switch.active {
            background: var(--success);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 27px;
            height: 27px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
        }

        .toggle-switch.active::after {
            transform: translateX(20px);
        }

        .keyboard-shortcuts {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 18px;
            padding: 15px;
            background: rgba(58, 58, 60, 0.45);
            border-radius: 12px;
        }

        .shortcut-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 9px 0;
        }

        .shortcut-key {
            background: rgba(120, 120, 128, 0.4);
            padding: 3px 9px;
            border-radius: 6px;
            font-family: 'SF Mono', ui-monospace, monospace;
            font-size: 0.76rem;
            color: var(--text-primary);
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUpSheet {
            from {
                opacity: 0;
                transform: translateY(100%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .omad-card {
            margin-top: 18px;
            padding: 16px;
            background: var(--bg-card);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 16px;
            border: 0.5px solid var(--hairline);
        }

        .omad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .omad-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .omad-status {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 500;
        }

        .omad-body {
            margin-top: 14px;
            text-align: center;
        }

        .omad-countdown {
            font-size: 2.4rem;
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .omad-countdown-label {
            font-size: 0.62rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-top: 6px;
        }

        .omad-time-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding: 10px 14px;
            background: var(--bg-inset);
            border-radius: 12px;
            border: 0.5px solid var(--hairline);
        }

        .omad-label {
            font-size: 0.88rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .omad-time-input {
            background: rgba(120, 120, 128, 0.24);
            border: none;
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 6px 10px;
            font-family: inherit;
            color-scheme: dark;
            -webkit-appearance: none;
        }

        /* ===== Focus mode: while the timer runs, hide everything that isn't
           the clock so the whole workout view fits on screen without
           scrolling. ===== */
        body.timer-active .omad-card,
        body.timer-active .program-selector,
        body.timer-active .day-selector,
        body.timer-active .progress-bar,
        body.timer-active .workout-title,
        body.timer-active .workout-meta,
        body.timer-active .collapsible-section,
        body.timer-active .section-title,
        body.timer-active #workoutContainer > .warmup-list,
        body.timer-active .complete-btn,
        body.timer-active .stats {
            display: none;
        }

        body.timer-active .header {
            margin-bottom: 8px;
            padding: 0;
        }

        body.timer-active .header h1 {
            font-size: 1.2rem;
            letter-spacing: -0.3px;
        }

        body.timer-active .settings-btn {
            width: 32px;
            height: 32px;
            font-size: 1rem;
            top: -4px;
        }

        body.timer-active .timer-section {
            padding: 12px 12px;
            margin-bottom: 0;
        }

        body.timer-active .current-exercise-display {
            padding: 10px 12px;
            margin-bottom: 10px;
        }

        body.timer-active .exercise-progress {
            margin-bottom: 5px;
            font-size: 0.58rem;
            padding: 3px 8px;
        }

        body.timer-active .current-exercise-name {
            font-size: 1.3rem;
            margin-bottom: 3px;
        }

        body.timer-active .current-exercise-details {
            font-size: 0.82rem;
        }

        body.timer-active .next-up-display {
            margin-top: 8px;
            padding: 6px 10px;
        }

        body.timer-active .phase-indicator {
            margin-bottom: 8px;
        }

        body.timer-active .timer-display-container {
            margin: 6px 0 10px 0;
        }

        body.timer-active .exercise-tracker {
            margin-top: 10px;
        }

        body.timer-active .timer-controls {
            margin-top: 10px;
        }

        @media (max-height: 750px) {
            body.timer-active .circular-timer {
                width: 210px;
                height: 210px;
            }

            body.timer-active .timer-display {
                font-size: 2.8rem;
            }
        }

        .notification {
            position: fixed;
            top: calc(var(--safe-top) + 10px);
            left: 12px;
            right: 12px;
            background: rgba(44, 44, 46, 0.96);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 13px 17px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            z-index: 2000;
            animation: slideInDown 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            max-width: 480px;
            margin: 0 auto;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-120%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notification-title {
            font-weight: 700;
            margin-bottom: 2px;
            color: var(--text-primary);
            font-size: 0.92rem;
            letter-spacing: -0.2px;
        }

        .notification-message {
            font-size: 0.83rem;
            color: var(--text-secondary);
        }

        /* Small phones */
        @media (max-width: 390px) {
            body {
                padding-left: calc(var(--safe-left) + 13px);
                padding-right: calc(var(--safe-right) + 13px);
            }

            .header h1 {
                font-size: 1.9rem;
            }

            .circular-timer {
                width: 220px;
                height: 220px;
            }

            .timer-display {
                font-size: 3rem;
            }

            .current-exercise-name {
                font-size: 1.45rem;
            }
        }

        @media (max-width: 350px) {
            .circular-timer {
                width: 195px;
                height: 195px;
            }

            .timer-display {
                font-size: 2.6rem;
            }

            .day-btn {
                font-size: 0.65rem;
            }
        }

        /* Landscape */
        @media (max-height: 500px) and (orientation: landscape) {
            .header {
                margin-bottom: 10px;
            }

            .circular-timer {
                width: 150px;
                height: 150px;
            }

            .timer-display {
                font-size: 2rem;
            }

            .day-selector {
                margin-bottom: 10px;
            }
        }

        :root {
            --work: #FF5A1F;
            --work-ink: #140A05;
            --rest-bg: #061B24;
            --rest: #36C5F0;
            --rest-soft: #8FD9F2;
            --rest-card: #0D2C39;
            --rest-line: #1A4A5E;
            --ink: #0B0C0E;
            --surface: #17191C;
            --surface-2: #24272B;
            --done: #F2F3F5;
            --cond: 'FC Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
        }

        body.session-open { overflow: hidden; }

        .session {
            position: fixed;
            inset: 0;
            z-index: 900;
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: calc(var(--safe-top) + 10px) calc(var(--safe-right) + 18px) calc(var(--safe-bottom) + 14px) calc(var(--safe-left) + 18px);
            background: var(--ink);
            color: #F2F3F5;
            transition: background-color 0.25s ease, color 0.25s ease;
            overflow: hidden;
        }
        .session.open { display: flex; }
        .session.work { background: var(--work); color: var(--work-ink); }
        .session.rest { background: var(--rest-bg); color: #E6F6FB; }
        .session.block { background: var(--ink); color: #F2F3F5; }

        .s-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 36px; }
        .s-meta { font-size: 0.72rem; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; }
        .session.rest .s-meta { color: var(--rest-soft); }
        .session.block .s-meta { color: #8C939B; }
        .s-lock {
            width: 44px; height: 44px; border-radius: 12px; border: none;
            background: rgba(0, 0, 0, 0.16); color: inherit; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .session.rest .s-lock, .session.block .s-lock { background: rgba(255, 255, 255, 0.08); }
        .s-lock.on { background: var(--work-ink); color: var(--work); }

                return segs;

            const after = w.blocksAfter || [];

            const exs = w.exercises || [];

                        speed: ex.speed, grade: ex.grade, ex: i, round: r
                    });

                    if (w.restTime > 0 && !last) {

                            speed: w.restSpeed, grade: w.restGrade, ex: i, round: r

            const kg = (Number(settings.weightLb) || 180) / 2.2046;

                    <div class="s-tile"><div class="v" id="sKcal">0<small>kcal</small></div><div class="t">Net, ACSM est.</div></div>
                    <div class="s-tile"><div class="v" id="sLeft">0:00</div><div class="t" id="sLeftLabel">Left in block</div></div>
                </div>
                ${steadyPlan ? planHtml : `<div class="s-next" style="background:#17191C"><small>NEXT</small>${nextText()}</div>`}
                ${controlsHtml(s)}`;
        }

        function renderSession() {
            if (!sessionOpen) return;
            const el = document.getElementById('session');
            const s = plan[segIdx];
            if (!s) return;
            el.className = `session open ${s.kind}${status === 'paused' ? ' paused' : ''}${locked ? ' locked' : ''}`;
            let html = `<div class="s-lockveil"></div>
                <div class="s-top">
                    <div class="s-meta">${metaText(s)}</div>
                    <button class="s-lock ${locked ? 'on' : ''}" onclick="toggleLock()" aria-label="${locked ? 'Unlock' : 'Lock'} controls">${locked ? '🔒' : '🔓'}</button>
                </div>`;
            html += s.kind === 'work' ? workView(s) : s.kind === 'rest' ? restView(s) : blockView(s);
            el.innerHTML = html;
            bindHold(document.getElementById('sMain'));
            tickSession();
        }

        function tickSession() {
            if (!sessionOpen) return;
            const s = plan[segIdx];
            if (!s) return;
            const rem = remainingNow();

            const d = document.getElementById('sDigits');
            if (d) {
                const txt = fmtClock(rem);
                d.textContent = txt;
                d.classList.toggle('mid', txt.length === 4);
                d.classList.toggle('long', txt.length >= 5);
            }
            const u = document.getElementById('sUnit');
            if (u) {
                const unit = rem < 60 ? 'sec' : 'min';
                u.textContent = s.kind === 'work' ? `${unit} · work` : `${unit} · ${s.name}`;
            }
            const ring = document.getElementById('sRing');
            if (ring) ring.style.strokeDashoffset = 276.46 * (1 - rem / s.dur);

            const el = document.getElementById('sElapsed');
            if (el) {
                const total = totalPlanSeconds();
                const elapsed = elapsedSeconds();
                el.textContent = fmtMMSS(elapsed);
                document.getElementById('sOf').textContent = `OF ${fmtMMSS(total)}`;
                document.getElementById('sBar').style.width = `${Math.min(100, elapsed / total * 100)}%`;
                document.getElementById('sKcal').innerHTML = `${kcalSoFar()}<small>kcal</small>`;
                document.getElementById('sLeft').textContent = fmtMMSS(rem);
                const n = plan[segIdx + 1];
                document.getElementById('sLeftLabel').textContent = n ? `Until ${n.name}` : 'Left in workout';
            }
        }

        function bindHold(btn) {
            if (!btn) return;
            let timer = null;
            let fired = false;
            const cancel = () => { clearTimeout(timer); btn.classList.remove('holding'); };
            btn.addEventListener('pointerdown', () => {
                if (locked) return;
                fired = false;
                btn.classList.add('holding');
                timer = setTimeout(() => {
                    fired = true;
                    btn.classList.remove('holding');
                    haptic(ImpactStyle.Heavy);
                    endSession();
                }, 1100);
            });
            btn.addEventListener('pointerup', () => {
                cancel();
                if (!fired && !locked) togglePause();
            });
            btn.addEventListener('pointerleave', cancel);
            btn.addEventListener('pointercancel', cancel);
            btn.addEventListener('contextmenu', e => e.preventDefault());
        }

        // ----- Live Activity (lock screen) -----
        const LiveActivity = Capacitor.Plugins?.LiveActivity;
        let liveActivityRunning = false;

        function laLabel(s) {
            if (s.kind === 'rest') return `${s.name} ${s.dur}s`;
            if (s.kind === 'block') return s.speed ? `${s.name} · ${fmtSpeed(s.speed)} mph ${s.grade}%` : s.name;
            return s.name;
        }

        function liveActivityPayload() {
            const w = workout();
            const s = plan[segIdx];
            const rem = remainingNow();
            const running = status === 'running' && timeline.length;
            const upcoming = [];
            if (running) {
                for (let k = timelineIndex + 1; k < timeline.length && upcoming.length < 4; k++) {
                    upcoming.push({ label: laLabel(plan[timeline[k].i]), at: timeline[k].start });
                }
            }
            let restOfPlan = rem;
            for (let i = segIdx + 1; i < plan.length; i++) restOfPlan += plan[i].dur;
            const isBlock = s.kind === 'block';
            const n = plan[segIdx + 1];
            return {
                workoutTitle: w.title,
                exercise: s.name,
                details: s.kind === 'rest' ? (nextNonRest(segIdx + 1) ? `Next: ${nextNonRest(segIdx + 1).name}` : '') : (isBlock ? speedText(s) : s.details),
                nextExercise: n ? laLabel(n) : '',
                phase: s.kind === 'work' ? 'WORK' : s.kind === 'rest' ? 'REST' : 'BLOCK',
                round: isBlock ? s.blockIdx + 1 : s.round,
                totalRounds: isBlock ? s.blockTotal : (w.rounds || 1),
                endTime: running ? phaseEndAt : Date.now() + rem * 1000,
                exerciseIndex: isBlock ? s.blockIdx + 1 : s.ex + 1,
                totalExercises: isBlock ? s.blockTotal : (w.exercises || []).length,
                upcoming,
                paused: status !== 'running',
                pausedRemaining: rem,
                workoutEnd: Date.now() + restOfPlan * 1000
            };
        }

        async function startLiveActivity() {
            if (!LiveActivity) return;
            try {
                await LiveActivity.start(liveActivityPayload());
                liveActivityRunning = true;
            } catch (e) {
                console.log('Live Activity unavailable:', e);
            }
        }

        async function updateLiveActivity() {
            if (!LiveActivity || !liveActivityRunning || !plan[segIdx]) return;
            try {
                await LiveActivity.update(liveActivityPayload());
            } catch (e) {
                console.log('Live Activity update failed:', e);
            }
        }

        async function endLiveActivity() {
            if (!LiveActivity || !liveActivityRunning) return;
            liveActivityRunning = false;
            try {
                await LiveActivity.end();
            } catch (e) {
                console.log('Live Activity end failed:', e);
            }
        }

        // ----- Pre-scheduled notifications (one per upcoming segment change) -----
        const PHASE_NOTIFICATION_BASE_ID = 1001;
        const MAX_SCHEDULED_NOTIFICATIONS = 60; // iOS caps pending at 64

        function notifText(n, prev, i) {
            if (n.kind === 'work') {
                if (prev && prev.kind !== 'block' && n.round > prev.round) {
                    return { title: `Round ${n.round} · ${n.name}`, body: n.details || 'Go' };
                }
                return { title: `▶ ${n.name}`, body: n.details || 'Go' };
            }
            if (n.kind === 'rest') {
                const after = nextNonRest(i + 1);
                return { title: `${n.name} ${n.dur}s`, body: after ? `Next: ${after.name}${after.details ? ' · ' + after.details : ''}` : 'Last stretch' };
            }
            const mins = Math.round(n.dur / 60);
            return { title: n.name, body: n.speed ? `${fmtSpeed(n.speed)} mph · ${n.grade}% · ${mins} min` : `${n.details || ''} · ${mins} min` };
        }

        // Chain entry k fires at the end of timeline[k]
        function buildPhaseNotificationChain() {
            const chain = [];
            for (let k = 0; k < timeline.length && chain.length < MAX_SCHEDULED_NOTIFICATIONS; k++) {
                const at = timeline[k].end;
                const nextT = timeline[k + 1];
                if (nextT) {
                    chain.push({ at, ...notifText(plan[nextT.i], plan[timeline[k].i], nextT.i) });
                } else if (timeline[k].i >= plan.length - 1) {
                    chain.push({ at, title: 'Workout complete 💪', body: `${workout().title} — done.` });
                } else {
                    chain.push({ at, title: 'Ready for the next one', body: `Next: ${plan[timeline[k].i + 1].name}` });
                }
            }
            return chain;
        }


        // ===== OMAD fast scheduler (unchanged) =====
        // ===== OMAD fast scheduler =====
        // One meal a day: shows a live countdown to the next meal and fires
        // daily repeating notifications (30-min heads-up + meal-time alert)
        // that work even when the app is closed.
        const OMAD_MEAL_ID = 2001;
        const OMAD_PREALERT_ID = 2002;
        let omad = JSON.parse(localStorage.getItem('omad') || '{"enabled": false, "time": "18:00"}');

        function omadNextMeal() {
            const [h, m] = omad.time.split(':').map(Number);
            const d = new Date();
            d.setHours(h, m, 0, 0);
            if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
            return d;
        }

        function omadTimeLabel() {
            const [h, m] = omad.time.split(':').map(Number);
            const d = new Date();
            d.setHours(h, m, 0, 0);
            return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }

        async function scheduleOmadNotifications() {
            if (!LocalNotifications) return;
            try {
                await LocalNotifications.cancel({
                    notifications: [{ id: OMAD_MEAL_ID }, { id: OMAD_PREALERT_ID }]
                });
                if (!omad.enabled) return;

                const [h, m] = omad.time.split(':').map(Number);
                const pre = new Date();
                pre.setHours(h, m, 0, 0);
                pre.setMinutes(pre.getMinutes() - 30);

                // schedule.on = daily repeating calendar trigger on iOS
                await LocalNotifications.schedule({
                    notifications: [
                        {
                            id: OMAD_MEAL_ID,
                            title: '🍽 Meal Time!',
                            body: 'Fast complete — time to eat. Protein first, veggies for volume.',
                            schedule: { on: { hour: h, minute: m }, allowWhileIdle: true },
                            sound: 'default'
                        },
                        {
                            id: OMAD_PREALERT_ID,
                            title: 'Meal in 30 minutes',
                            body: 'Start prepping now — never decide what to eat ravenous.',
                            schedule: { on: { hour: pre.getHours(), minute: pre.getMinutes() }, allowWhileIdle: true },
                            sound: 'default'
                        }
                    ]
                });
            } catch (e) {
                console.log('OMAD scheduling failed:', e);
            }
        }

        function updateOmadUI() {
            const toggle = document.getElementById('omadToggle');
            const body = document.getElementById('omadBody');
            const status = document.getElementById('omadStatus');
            const input = document.getElementById('omadTime');
            if (!toggle) return;

            toggle.classList.toggle('active', omad.enabled);
            body.style.display = omad.enabled ? 'block' : 'none';
            status.textContent = omad.enabled
                ? `Daily meal at ${omadTimeLabel()} • alerts on`
                : 'Off';
            input.value = omad.time;
            omadTick();
        }

        function omadTick() {
            if (!omad.enabled) return;
            const el = document.getElementById('omadCountdown');
            if (!el) return;
            const diff = Math.max(0, omadNextMeal().getTime() - Date.now());
            const hh = Math.floor(diff / 3600000);
            const mm = Math.floor((diff % 3600000) / 60000);
            const ss = Math.floor((diff % 60000) / 1000);
            el.textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
        }

        function toggleOmad() {
            omad.enabled = !omad.enabled;
            localStorage.setItem('omad', JSON.stringify(omad));
            if (omad.enabled) requestNotificationPermission();
            scheduleOmadNotifications();
            updateOmadUI();
            playBeep(700, 80);
            if (omad.enabled) {
                showNotification('OMAD Fast On', `You'll be alerted at ${omadTimeLabel()} daily`);
            }
        }

        function setOmadTime(value) {
            if (!/^\d{2}:\d{2}$/.test(value)) return;
            omad.time = value;
            localStorage.setItem('omad', JSON.stringify(omad));
            scheduleOmadNotifications();
            updateOmadUI();
            playBeep(600, 80);
        }

        async function schedulePhaseEndNotification() {
            if (!LocalNotifications || !settings.notifications) return;
            try {
                await cancelPhaseEndNotification();
                const chain = buildPhaseNotificationChain();
                if (!chain.length) return;
                await LocalNotifications.schedule({
                    notifications: chain.map((n, i) => ({
                        id: PHASE_NOTIFICATION_BASE_ID + i,
                        title: n.title,
                        body: n.body,
                        // 1s after the flip so foreground JS can cancel first
                        schedule: { at: new Date(n.at + 1000), allowWhileIdle: true },
                        sound: 'default'
                    }))
                });
            } catch (e) {
                console.log('Failed to schedule notifications:', e);
            }
        }

        async function cancelPhaseEndNotification() {
            if (!LocalNotifications) return;
            try {
                await LocalNotifications.cancel({
                    notifications: Array.from(
                        { length: MAX_SCHEDULED_NOTIFICATIONS },
                        (_, i) => ({ id: PHASE_NOTIFICATION_BASE_ID + i })
                    )
                });
            } catch (e) {
                // nothing pending
            }
        }

        // Cancel a single chain entry (chain index i = end of timeline segment i)
        async function cancelChainNotification(chainIndex) {
            if (!LocalNotifications || chainIndex < 0 || chainIndex >= MAX_SCHEDULED_NOTIFICATIONS) return;
            try {
                await LocalNotifications.cancel({
                    notifications: [{ id: PHASE_NOTIFICATION_BASE_ID + chainIndex }]
                });
            } catch (e) {
                // already delivered or not pending — fine
            }
        }

        // ===== Audio =====
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioContext();

        function unlockAudio() {
            try { if (audioContext.state === 'suspended') audioContext.resume(); } catch (e) {}
        }

        async function playBeep(frequency = 800, duration = 100) {
            if (frequency >= 900) haptic(ImpactStyle.Heavy);
            else if (frequency >= 700) haptic(ImpactStyle.Medium);
            else haptic(ImpactStyle.Light);

            if (!settings.sound) return;
            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = frequency;
                oscillator.type = 'triangle';   // more presence than a sine over music
                gainNode.gain.setValueAtTime(0.6, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration / 1000);
            } catch (e) { /* audio unavailable */ }
        }

        async function showNotification(title, message) {
            if (!settings.notifications) return;
            if (sessionOpen) return; // the workout screen already shows the phase
            haptic(ImpactStyle.Medium);
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.innerHTML = `
                <div class="notification-title">${title}</div>
                <div class="notification-message">${message}</div>
            `;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        async function requestNotificationPermission() {
            if (LocalNotifications) {
                try {
                    const permission = await LocalNotifications.checkPermissions();
                    if (permission.display === 'prompt') {
                        await LocalNotifications.requestPermissions();
                    }
                } catch (e) {
                    console.log('Notification permissions not available:', e);
                }
            }
        }

        // ===== Day / program selection =====
        function stopEverything() {
            if (status !== 'idle') { halt(); endLiveActivity(); }
            if (sessionOpen) closeSession();
        }

        function selectDay(day) {
            stopEverything();
            currentDay = day;
            updateDayButtons();
            loadWorkout();
        }

        function selectProgram(id) {
            if (!PROGRAMS[id] || id === currentProgram) return;
            stopEverything();
            currentProgram = id;
            workoutData = PROGRAMS[id].days;
            localStorage.setItem('program', id);
            updateProgramButtons();
            selectDay(currentDay);
            playBeep(600, 100);
        }

        function updateProgramButtons() {
            document.querySelectorAll('.program-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.program === currentProgram);
            });
        }

        const dayKey = (d = currentDay, p = currentProgram) => `${p}-${d}`;

        function updateDayButtons() {
            document.querySelectorAll('.day-btn').forEach((btn, index) => {
                btn.classList.remove('active', 'completed');
                if (index + 1 === currentDay) btn.classList.add('active');
                if (completedDays.includes(dayKey(index + 1))) btn.classList.add('completed');
            });
        }

        // ===== Saved position (survives leaving the day or the app being killed) =====
        function saveState() {
            try {
                localStorage.setItem('timerState', JSON.stringify({
                    program: currentProgram, day: currentDay, seg: segIdx,
                    remaining: remainingNow(), running: status === 'running', savedAt: Date.now()
                }));
            } catch (e) {}
        }

        function readSavedPosition() {
            try {
                const s = JSON.parse(localStorage.getItem('timerState') || 'null');
                if (!s || s.program !== currentProgram || s.day !== currentDay || typeof s.seg !== 'number') return null;
                if (s.seg >= plan.length) return null;
                let seg = s.seg;
                let remaining = Math.min(s.remaining, plan[seg].dur);
                // If it was running when the app died, walk the clock forward
                if (s.running) {
                    let gone = Math.floor((Date.now() - s.savedAt) / 1000);
                    while (gone > 0 && seg < plan.length) {
                        if (gone < remaining) { remaining -= gone; gone = 0; }
                        else { gone -= remaining; seg++; remaining = seg < plan.length ? plan[seg].dur : 0; }
                    }
                    if (seg >= plan.length) return null;
                }
                // Older than 12 hours: start fresh
                if (Date.now() - s.savedAt > 12 * 3600 * 1000) return null;
                return { seg, remaining: Math.max(1, remaining) };
            } catch (e) {
                return null;
            }
        }

        // ===== Day page =====
        function loadWorkout() {
            const w = workout();
            const container = document.getElementById('workoutContainer');
            plan = planFor(w);

            if (w.type === 'rest') {
                container.innerHTML = `
                    <div class="rest-day">
                        <h2>🌙 Rest Day</h2>
                        <p style="color: #999; margin-bottom: 25px; line-height: 1.6;">${w.message}</p>
                        <div class="warmup-list" style="text-align: left;">
                            ${w.activities.map(a => `<p>${a}</p>`).join('')}
                        </div>
                        <button class="timer-btn full primary" onclick="markDayComplete()" style="margin-top: 25px;">
                            <span>✓ Mark Complete</span>
                        </button>
                    </div>
                `;
                updateStats();
                return;
            }

            const saved = readSavedPosition();
            if (saved) { segIdx = saved.seg; segRemaining = saved.remaining; }
            else { segIdx = 0; segRemaining = plan[0].dur; }
            const inProgress = !!saved && !(segIdx === 0 && segRemaining === plan[0].dur);

            const exs = w.exercises || [];
            const minutes = Math.round(totalPlanSeconds() / 60);
            const kcal = kcalTotalPlan();
            let meta;
            if (w.type === 'steady') meta = `${minutes} min • ${plan.length} blocks${kcal ? ` • ~${kcal} kcal net` : ''}`;
            else meta = `${minutes} min • ${w.rounds} rounds${exs.length > 1 ? ` × ${exs.length} moves` : ''}`;

            let html = `
                <div class="workout-title">${w.title}</div>
                <div class="workout-meta">${meta}</div>
            `;

            const s = plan[segIdx];
            const first = plan.find(p => p.kind !== 'rest');
            let label, headline, sub;
            if (inProgress) {
                label = 'Paused here';
                headline = s.kind === 'rest' ? `${s.name} → ${(nextNonRest(segIdx + 1) || s).name}` : s.name;
                sub = s.kind === 'block'
                    ? `${fmtMMSS(segRemaining)} left in this block${s.speed ? ' · ' + speedText(s) : ''}`
                    : `Round ${s.round} of ${w.rounds} · ${fmtClock(segRemaining)}${segRemaining < 60 ? 's' : ''} left`;
            } else if (w.type === 'steady') {
                label = 'First up';
                headline = first.name;
                sub = first.speed ? `${speedText(first)} · ${Math.round(first.dur / 60)} min` : first.details;
            } else {
                label = 'First up';
                headline = first.name;
                sub = first.kind === 'block'
                    ? `${speedText(first)} · ${Math.round(first.dur / 60)} min, then ${w.rounds} × ${w.workTime}s on / ${w.restTime}s off`
                    : `${first.details}${first.details ? ' · ' : ''}${w.workTime}s on / ${w.restTime}s off`;
            }

            html += `
                <div class="start-card">
                    <div class="sc-label">${label}</div>
                    <div class="sc-first">${headline}</div>
                    <div class="sc-sub">${sub}</div>
                    ${inProgress
                        ? `<div class="start-row">
                               <button class="start-btn" onclick="startSession(false)">▶ Resume</button>
                               <button class="ghost-btn" onclick="startSession(true)">Start over</button>
                           </div>`
                        : `<button class="start-btn" onclick="startSession(true)">▶ Start</button>`}
                </div>
            `;

            html += `<div class="collapsible-section">`;

            if (w.type === 'steady') {
                let t = 0;
                html += `<div class="plan-list">` + plan.map(b => {
                    const from = t / 60, to = (t + b.dur) / 60;
                    t += b.dur;
                    return `<div><b>${from}–${to} min · ${b.name}</b><span>${speedText(b) || b.details}</span></div>`;
                }).join('') + `</div>`;
            }

            if (w.warmup) {
                html += `
                    <button class="collapse-btn" onclick="toggleCollapse(this)">
                        <span>🔥 Warm-up (5 min)</span>
                        <span>▼</span>
                    </button>
                    <div class="collapse-content">
                        <div class="warmup-list" style="margin-top: 10px;">
                            ${w.warmup.map(item => `<p>${item}</p>`).join('')}
                        </div>
                    </div>
                `;
            }

            if (exs.length) {
                html += `
                    <button class="collapse-btn" onclick="toggleCollapse(this)" style="margin-top: ${w.warmup ? '10px' : '0'};">
                        <span>💪 All Exercises (${exs.length})</span>
                        <span>▼</span>
                    </button>
                    <div class="collapse-content">
                        <div class="exercise-list" style="margin-top: 10px;">
                `;
                exs.forEach((exercise, index) => {
                    const isCompleted = completedExercises[`${currentProgram}-${currentDay}-${index}`] || false;
                    html += `
                        <div class="exercise-item ${isCompleted ? 'completed' : ''}" id="exercise-${index}">
                            <div class="exercise-header">
                                <div>
                                    <div class="exercise-name">${exercise.name}</div>
                                    <div class="exercise-details">${exercise.details}</div>
                                </div>
                                <input type="checkbox" class="exercise-checkbox"
                                       ${isCompleted ? 'checked' : ''}
                                       onchange="toggleExercise(${index})">
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }

            html += `</div>`;

            if (w.finisher) {
                html += `
                    <div class="section-title">🔥 Finisher</div>
                    <div class="warmup-list">
                        ${w.finisher.map(item => `<p>${item}</p>`).join('')}
                    </div>
                `;
            }

            if (w.cooldown) {
                html += `
                    <div class="section-title">🧊 Cool-down</div>
                    <div class="warmup-list">
                        ${w.cooldown.map(item => `<p>${item}</p>`).join('')}
                    </div>
                `;
            }

            const done = completedDays.includes(dayKey());
            html += `
                <button class="timer-btn full complete-btn" onclick="completeFromPage()" style="margin-top: 25px;">
                    <span>${done ? '✓ Completed' : '✓ Mark Workout Complete'}</span>
                </button>
            `;

            container.innerHTML = html;
            updateStats();
        }

        function toggleCollapse(button) {
            const content = button.nextElementSibling;
            const arrow = button.querySelector('span:last-child');
            const open = content.classList.toggle('expanded');
            arrow.textContent = open ? '▲' : '▼';
        }

        function toggleExercise(index) {
            const exerciseKey = `${currentProgram}-${currentDay}-${index}`;
            completedExercises[exerciseKey] = !completedExercises[exerciseKey];
            localStorage.setItem('completedExercises', JSON.stringify(completedExercises));
            const exerciseElement = document.getElementById(`exercise-${index}`);
            if (exerciseElement) exerciseElement.classList.toggle('completed', completedExercises[exerciseKey]);
            playBeep(700, 80);
        }

        // ===== Completion + stats =====
        function completeWorkout(message) {
            cancelPhaseEndNotification();
            endLiveActivity();
            const key = dayKey();
            if (!completedDays.includes(key)) {
                completedDays.push(key);
                localStorage.setItem('completedDays', JSON.stringify(completedDays));
                tones([900, 1100]);
                showNotification('Workout Complete!', message || 'Excellent work! 💪🔥');
            }
            updateDayButtons();
            updateStats();
            localStorage.removeItem('timerState');
        }

        function completeFromPage() {
            stopEverything();
            completeWorkout();
            segIdx = 0;
            segRemaining = plan[0] ? plan[0].dur : 0;
            loadWorkout();
        }

        function markDayComplete() {
            completeWorkout();
        }

        function trainingDayCount(p = currentProgram) {
            return Object.values(PROGRAMS[p].days).filter(w => w.type !== 'rest').length;
        }

        // Unique weekdays this week with a completed training (non-rest) session, any program
        function trainingDoneThisWeek() {
            const days = new Set();
            completedDays.forEach(k => {
                const [p, d] = String(k).split('-');
                const w = PROGRAMS[p] && PROGRAMS[p].days[d];
                if (w && w.type !== 'rest') days.add(Number(d));
            });
            return days.size;
        }

        // A week "counts" for the streak if you hit all but one training day
        const weekGoal = target => Math.max(1, target - 1);

        function weekStreak() {
            const history = JSON.parse(localStorage.getItem('weekHistory') || '[]');
            let streak = 0;
            for (let i = history.length - 1; i >= 0; i--) {
                if (history[i].done >= weekGoal(history[i].target)) streak++;
                else break;
            }
            if (trainingDoneThisWeek() >= weekGoal(trainingDayCount())) streak++;
            return streak;
        }

        function updateStats() {
            const lifetime = parseInt(localStorage.getItem('lifetimeWorkouts') || '0', 10);
            const done = trainingDoneThisWeek();
            const target = trainingDayCount();

            document.getElementById('totalWorkouts').textContent = lifetime + done;
            document.getElementById('weekProgress').innerHTML = `${done}<span class="stat-of">/${target}</span>`;
            document.getElementById('currentStreak').textContent = weekStreak();
            document.getElementById('progressFill').style.width = `${Math.min(100, done / target * 100)}%`;
        }

        // ===== Automatic weekly reset (Mondays) =====
        function getWeekKey(d = new Date()) {
            const daysSinceMonday = (d.getDay() + 6) % 7;
            const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - daysSinceMonday);
            return `${monday.getFullYear()}-${monday.getMonth() + 1}-${monday.getDate()}`;
        }

        function weekKeyToDate(key) {
            const [y, m, d] = key.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function checkWeeklyReset() {
            const key = getWeekKey();
            const stored = localStorage.getItem('weekKey');
            if (stored === key) return false;

            if (stored) {
                const done = trainingDoneThisWeek();
                const lifetime = parseInt(localStorage.getItem('lifetimeWorkouts') || '0', 10);
                localStorage.setItem('lifetimeWorkouts', String(lifetime + done));

                const history = JSON.parse(localStorage.getItem('weekHistory') || '[]');
                history.push({ week: stored, done, target: trainingDayCount() });
                // Weeks the app was never opened count as missed
                const gapWeeks = Math.round((weekKeyToDate(key) - weekKeyToDate(stored)) / (7 * 864e5)) - 1;
                for (let g = 0; g < Math.min(gapWeeks, 52); g++) history.push({ week: 'gap', done: 0, target: trainingDayCount() });
                localStorage.setItem('weekHistory', JSON.stringify(history.slice(-104)));

                completedDays = [];
                completedExercises = {};
                localStorage.setItem('completedDays', '[]');
                localStorage.setItem('completedExercises', '{}');
            }
            localStorage.setItem('weekKey', key);
            return stored !== null;
        }

        // ===== Settings =====
        function saveSettings() {
            localStorage.setItem('settings', JSON.stringify(settings));
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
            updateSettingsUI();
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function updateSettingsUI() {
            document.getElementById('soundToggle').classList.toggle('active', settings.sound);
            document.getElementById('voiceToggle').classList.toggle('active', settings.voice);
            document.getElementById('notificationToggle').classList.toggle('active', settings.notifications);
            document.getElementById('autoAdvanceToggle').classList.toggle('active', settings.autoAdvance);
            document.getElementById('weightInput').value = settings.weightLb;
        }

        function toggleSound() {
            settings.sound = !settings.sound;
            saveSettings();
            updateSettingsUI();
            if (settings.sound) playBeep(800, 100);
        }

        function toggleVoice() {
            settings.voice = !settings.voice;
            saveSettings();
            updateSettingsUI();
            if (settings.voice) say('Voice cues on');
        }

        function toggleNotifications() {
            settings.notifications = !settings.notifications;
            saveSettings();
            updateSettingsUI();
            if (settings.notifications) {
                requestNotificationPermission();
                showNotification('Notifications Enabled', 'You\'ll be notified of timer events');
            } else {
                cancelPhaseEndNotification();
            }
        }

        function toggleAutoAdvance() {
            settings.autoAdvance = !settings.autoAdvance;
            saveSettings();
            updateSettingsUI();
            playBeep(700, 80);
        }

        function setWeight(value) {
            const n = Math.round(Number(value));
            if (n >= 80 && n <= 400) {
                settings.weightLb = n;
                saveSettings();
                if (workout().type !== 'rest' && !sessionOpen) loadWorkout();
            } else {
                updateSettingsUI();
            }
        }

        function resetAllProgress() {
            if (confirm('Are you sure you want to reset all progress? This cannot be undone.')) {
                stopEverything();
                localStorage.clear();
                completedDays = [];
                completedExercises = {};
                settings = { sound: true, notifications: true, autoAdvance: true, voice: true, weightLb: 180 };
                localStorage.setItem('startDate', Date.now());
                selectDay(1);
                closeSettings();
                showNotification('Progress Reset', 'Starting fresh! 💪');
            }
        }

        // Space bar pauses/resumes (handy in a desktop browser)
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === ' ' && sessionOpen) {
                e.preventDefault();
                togglePause();
            }
        });

        document.getElementById('settingsModal').addEventListener('click', (e) => {
            if (e.target.id === 'settingsModal') closeSettings();
        });

        // ===== Init =====
        document.addEventListener('DOMContentLoaded', function() {
            if (!localStorage.getItem('startDate')) {
                localStorage.setItem('startDate', Date.now());
            }

            checkWeeklyReset();
            requestNotificationPermission();
            updateProgramButtons();

            updateOmadUI();
            scheduleOmadNotifications();
            setInterval(omadTick, 1000);

            const today = new Date().getDay() || 7;
            selectDay(today);
        });

        window.addEventListener('beforeunload', saveState);

        // Re-sync to the wall clock whenever the app comes back from lock/background
        function onAppResume() {
            if (checkWeeklyReset() && !sessionOpen) {
                updateDayButtons();
                loadWorkout();
            }
            syncTimer();
            if (sessionOpen) tickSession();
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) onAppResume();
            else saveState();
        });

        const CapApp = Capacitor.Plugins?.App;
        if (CapApp) {
            CapApp.addListener('appStateChange', (state) => {
                if (state.isActive) onAppResume(); else saveState();
            });
            CapApp.addListener('resume', () => onAppResume());
        }

        document.addEventListener('click', unlockAudio, { once: true });

    </script>
</body>
</html>
