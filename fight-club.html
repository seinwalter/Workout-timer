<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fight Club">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="format-detection" content="telephone=no">
    <title>Fight Club - Workout Timer</title>
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='75' font-size='75'%3E%F0%9F%A5%8A%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --accent: #ff3b30;
            --accent-light: #ff6b6b;
            --accent-glow: rgba(255, 59, 48, 0.4);
            --success: #34c759;
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --bg-tertiary: #2c2c2e;
            --bg-quaternary: #3a3a3c;
            --text-primary: #ffffff;
            --text-secondary: #ebebf599;
            --text-tertiary: #ebebf54d;
            --separator: #38383a;
            --blur: saturate(180%) blur(20px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            height: 100%;
            overflow-x: hidden;
        }

        html, body {
            overscroll-behavior-y: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            padding: calc(var(--safe-top) + 8px) calc(var(--safe-right) + 16px) calc(var(--safe-bottom) + 16px) calc(var(--safe-left) + 16px);
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            letter-spacing: -0.01em;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at top right, rgba(255, 59, 48, 0.08) 0%, transparent 40%),
                radial-gradient(ellipse at bottom left, rgba(255, 107, 107, 0.05) 0%, transparent 40%),
                linear-gradient(180deg, #0a0a0a 0%, #000000 100%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 8px 0 16px 0;
            position: relative;
        }

        .settings-btn {
            position: absolute;
            right: -4px;
            top: 4px;
            background: rgba(44, 44, 46, 0.6);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.3rem;
            padding: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: transform 0.2s ease, background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:active {
            transform: scale(0.9);
            background: rgba(60, 60, 62, 0.8);
        }

        .header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ff3b30 0%, #ff6b6b 50%, #ff8787 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            line-height: 1;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .progress-bar {
            background: rgba(60, 60, 62, 0.5);
            border-radius: 10px;
            height: 4px;
            margin: 14px auto 0 auto;
            max-width: 200px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 100%);
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .day-selector {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 22px;
            padding: 6px;
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 14px;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
        }

        .day-btn {
            padding: 10px 2px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
            font-weight: 600;
            font-size: 0.72rem;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-user-select: none;
            user-select: none;
        }

        .day-btn span {
            position: relative;
            z-index: 1;
        }

        .day-btn:active {
            transform: scale(0.92);
        }

        .day-btn.active {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
            font-weight: 700;
        }

        .day-btn.completed {
            color: var(--success);
        }

        .day-btn.completed.active {
            color: #fff;
        }

        .day-btn.completed::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--success);
        }

        .day-btn.completed.active::after {
            background: #fff;
        }

        .workout-title {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--text-primary);
            letter-spacing: -0.8px;
            line-height: 1.1;
        }

        .workout-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 18px;
            font-weight: 500;
        }

        .timer-section {
            background: linear-gradient(165deg, rgba(28, 28, 30, 0.9) 0%, rgba(20, 20, 22, 0.95) 100%);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 24px;
            padding: 20px 16px;
            margin-bottom: 18px;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .phase-indicator {
            text-align: center;
            font-size: 0.7rem;
            margin-bottom: 14px;
            color: var(--text-secondary);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .phase-indicator #currentPhase {
            color: var(--accent-light);
        }

        .current-exercise-display {
            text-align: center;
            margin-bottom: 18px;
            padding: 18px 16px;
            background: linear-gradient(165deg, rgba(255, 59, 48, 0.12) 0%, rgba(255, 107, 107, 0.06) 100%);
            border-radius: 18px;
            border: 0.5px solid rgba(255, 59, 48, 0.3);
            box-shadow: 0 8px 24px rgba(255, 59, 48, 0.12);
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .exercise-progress {
            display: inline-block;
            font-size: 0.65rem;
            color: var(--accent-light);
            text-transform: uppercase;
            letter-spacing: 1.8px;
            margin-bottom: 10px;
            font-weight: 700;
            padding: 4px 10px;
            background: rgba(255, 59, 48, 0.15);
            border-radius: 100px;
        }

        .current-exercise-name {
            font-size: 1.65rem;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            line-height: 1.15;
        }

        .current-exercise-details {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.4;
            font-weight: 500;
        }

        .next-up-display {
            text-align: center;
            margin-top: 14px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 0.5px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .next-up-label {
            font-size: 0.65rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .next-up-name {
            font-size: 0.88rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .exercise-tracker {
            margin-top: 16px;
            text-align: center;
        }

        .tracker-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 100px;
            width: fit-content;
            margin: 0 auto;
        }

        .tracker-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), background 0.25s ease;
            cursor: pointer;
            min-width: 10px;
            min-height: 10px;
            position: relative;
        }

        .tracker-dot::before {
            content: '';
            position: absolute;
            inset: -8px;
        }

        .tracker-dot.active {
            background: var(--accent-light);
            box-shadow: 0 0 12px var(--accent-glow);
            transform: scale(1.4);
        }

        .tracker-dot.completed {
            background: var(--success);
        }

        .tracker-dot.completed.active {
            background: var(--accent-light);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .collapsible-section {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .collapse-btn {
            width: 100%;
            padding: 14px 16px;
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: transform 0.15s ease, background 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: -0.2px;
        }

        .collapse-btn:active {
            transform: scale(0.98);
            background: rgba(44, 44, 46, 0.9);
        }

        .collapse-btn span:last-child {
            color: var(--text-tertiary);
            font-size: 0.75rem;
            transition: transform 0.3s ease;
        }

        .collapse-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .collapse-content.expanded {
            max-height: 2000px;
        }

        .timer-display-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 12px 0 18px 0;
            position: relative;
        }

        .circular-timer {
            position: relative;
            width: 260px;
            height: 260px;
        }

        .circular-timer svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .circular-timer-bg {
            fill: none;
            stroke: rgba(60, 60, 62, 0.5);
            stroke-width: 8;
        }

        .circular-timer-progress {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.95s linear;
            filter: drop-shadow(0 0 10px currentColor);
        }

        .circular-timer-progress.work {
            stroke: var(--accent);
        }

        .circular-timer-progress.rest {
            stroke: var(--success);
        }

        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.5rem;
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            text-align: center;
            letter-spacing: -2px;
            line-height: 1;
        }

        .timer-display.work {
            color: var(--accent-light);
            text-shadow: 0 0 30px rgba(255, 59, 48, 0.5);
        }

        .timer-display.rest {
            color: var(--success);
            text-shadow: 0 0 30px rgba(52, 199, 89, 0.5);
        }

        .timer-display-label {
            font-size: 0.65rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 10px;
            font-weight: 700;
        }

        .timer-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 14px;
        }

        .timer-btn {
            padding: 14px 10px;
            background: rgba(44, 44, 46, 0.8);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: transform 0.15s ease, background 0.2s ease;
            position: relative;
            overflow: hidden;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: -0.2px;
            -webkit-user-select: none;
            user-select: none;
        }

        .timer-btn span {
            position: relative;
            z-index: 1;
        }

        .timer-btn:active {
            transform: scale(0.94);
            background: rgba(58, 58, 60, 0.9);
        }

        .timer-btn.full {
            grid-column: 1 / -1;
        }

        .timer-btn.half {
            grid-column: span 2;
        }

        .timer-btn.primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            border: none;
            box-shadow: 0 6px 16px var(--accent-glow);
            font-weight: 700;
        }

        .timer-btn.primary:active {
            box-shadow: 0 3px 8px var(--accent-glow);
        }

        .section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            color: var(--text-tertiary);
            margin: 20px 0 10px 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exercise-list {
            display: grid;
            gap: 6px;
            padding: 8px;
            background: rgba(28, 28, 30, 0.5);
            border-radius: 14px;
            border: 0.5px solid rgba(255, 255, 255, 0.05);
        }

        .exercise-item {
            background: transparent;
            border: none;
            border-radius: 10px;
            padding: 12px 14px;
            transition: background 0.2s ease;
            position: relative;
        }

        .exercise-item.active {
            background: rgba(255, 59, 48, 0.12);
        }

        .exercise-item.completed {
            opacity: 0.45;
        }

        .exercise-item.completed .exercise-name {
            text-decoration: line-through;
            text-decoration-color: var(--text-tertiary);
        }

        .exercise-item + .exercise-item {
            border-top: 0.5px solid rgba(255, 255, 255, 0.05);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .exercise-name {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 3px;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .exercise-details {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        .exercise-checkbox {
            width: 26px;
            height: 26px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: var(--success);
            min-width: 26px;
            min-height: 26px;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 50%;
            border: 2px solid var(--separator);
            background: transparent;
            position: relative;
            transition: all 0.2s ease;
        }

        .exercise-checkbox:checked {
            background: var(--success);
            border-color: var(--success);
        }

        .exercise-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%) rotate(45deg);
            width: 6px;
            height: 11px;
            border: solid white;
            border-width: 0 2px 2px 0;
        }

        .exercise-checkbox:active {
            transform: scale(0.9);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 0.5px solid var(--separator);
        }

        .stat {
            text-align: center;
            padding: 16px 10px;
            background: rgba(28, 28, 30, 0.7);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 16px;
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.2s ease;
        }

        .stat:active {
            transform: scale(0.96);
        }

        .stat-number {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-tertiary);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
        }

        .rest-day {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(165deg, rgba(28, 28, 30, 0.9) 0%, rgba(20, 20, 22, 0.95) 100%);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 24px;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
        }

        .rest-day h2 {
            font-size: 1.9rem;
            margin-bottom: 12px;
            color: var(--success);
            text-shadow: 0 0 30px rgba(52, 199, 89, 0.3);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .warmup-list {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.6;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 0.5px solid rgba(255, 255, 255, 0.05);
        }

        .warmup-list p {
            margin: 8px 0;
            padding-left: 18px;
            position: relative;
        }

        .warmup-list p::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 0.55em;
            width: 5px;
            height: 5px;
            background: var(--accent-light);
            border-radius: 50%;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.3s ease;
            padding: 0;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(180deg, rgba(44, 44, 46, 0.98) 0%, rgba(28, 28, 30, 0.98) 100%);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 28px 28px 0 0;
            padding: 24px 20px calc(var(--safe-bottom) + 24px) 20px;
            max-width: 500px;
            width: 100%;
            border-top: 0.5px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
            animation: slideUpSheet 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            max-height: 85vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 4px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 20px 0;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .close-btn {
            background: rgba(120, 120, 128, 0.32);
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
            font-weight: 600;
        }

        .close-btn:active {
            transform: scale(0.9);
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: rgba(58, 58, 60, 0.4);
            margin-bottom: 2px;
        }

        .setting-item:first-of-type {
            border-radius: 12px 12px 0 0;
        }

        .setting-item:last-of-type {
            border-radius: 0 0 12px 12px;
            margin-bottom: 0;
        }

        .setting-item:only-of-type {
            border-radius: 12px;
        }

        .setting-label {
            font-size: 0.95rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .toggle-switch {
            position: relative;
            width: 51px;
            height: 31px;
            background: rgba(120, 120, 128, 0.32);
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.25s ease;
        }

        .toggle-switch.active {
            background: var(--success);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 27px;
            height: 27px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.1);
        }

        .toggle-switch.active::after {
            transform: translateX(20px);
        }

        .keyboard-shortcuts {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 20px;
            padding: 16px;
            background: rgba(58, 58, 60, 0.4);
            border-radius: 12px;
        }

        .shortcut-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        .shortcut-key {
            background: rgba(120, 120, 128, 0.4);
            padding: 3px 10px;
            border-radius: 6px;
            font-family: 'SF Mono', ui-monospace, monospace;
            font-size: 0.78rem;
            color: var(--text-primary);
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUpSheet {
            from {
                opacity: 0;
                transform: translateY(100%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .notification {
            position: fixed;
            top: calc(var(--safe-top) + 12px);
            left: 12px;
            right: 12px;
            background: rgba(44, 44, 46, 0.95);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            z-index: 2000;
            animation: slideInDown 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            max-width: 500px;
            margin: 0 auto;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-120%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notification-title {
            font-weight: 700;
            margin-bottom: 2px;
            color: var(--text-primary);
            font-size: 0.95rem;
            letter-spacing: -0.2px;
        }

        .notification-message {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* iPhone X and similar devices (375 x 812) */
        @media only screen and (min-device-width: 375px) and (max-device-width: 414px)
            and (-webkit-min-device-pixel-ratio: 3)
            and (orientation: portrait) {
            .container {
                padding-bottom: calc(var(--safe-bottom) + 8px);
            }
        }

        /* Tablet / larger screens */
        @media (min-width: 501px) {
            body {
                padding-top: calc(var(--safe-top) + 20px);
            }

            .circular-timer {
                width: 280px;
                height: 280px;
            }

            .timer-display {
                font-size: 3.75rem;
            }
        }

        /* Standard phones (iPhone X, 11, 12, 13, 14, etc. - 375-414px) */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 2rem;
            }

            .workout-title {
                font-size: 1.6rem;
            }

            .current-exercise-name {
                font-size: 1.55rem;
            }

            .circular-timer {
                width: 240px;
                height: 240px;
            }

            .timer-display {
                font-size: 3.2rem;
            }

            .timer-btn {
                padding: 16px 10px;
                min-height: 54px;
                font-size: 0.95rem;
            }
        }

        /* iPhone X specific (375px wide) */
        @media (max-width: 390px) {
            body {
                padding-left: calc(var(--safe-left) + 14px);
                padding-right: calc(var(--safe-right) + 14px);
            }

            .header h1 {
                font-size: 1.9rem;
            }

            .day-btn {
                font-size: 0.7rem;
                padding: 10px 0;
            }

            .workout-title {
                font-size: 1.55rem;
            }

            .current-exercise-name {
                font-size: 1.5rem;
            }

            .circular-timer {
                width: 230px;
                height: 230px;
            }

            .timer-display {
                font-size: 3rem;
            }
        }

        /* Very small phones (iPhone SE, etc.) */
        @media (max-width: 360px) {
            body {
                padding-left: calc(var(--safe-left) + 10px);
                padding-right: calc(var(--safe-right) + 10px);
            }

            .header h1 {
                font-size: 1.7rem;
            }

            .day-btn {
                font-size: 0.65rem;
                padding: 9px 0;
                min-height: 40px;
            }

            .circular-timer {
                width: 200px;
                height: 200px;
            }

            .timer-display {
                font-size: 2.6rem;
            }

            .current-exercise-name {
                font-size: 1.4rem;
            }

            .timer-btn {
                padding: 14px 8px;
                font-size: 0.88rem;
                min-height: 50px;
            }

            .timer-section {
                padding: 16px 12px;
            }

            .stat-number {
                font-size: 1.7rem;
            }
        }

        /* Landscape mode */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding-top: calc(var(--safe-top) + 6px);
            }

            .header {
                margin-bottom: 10px;
                padding-bottom: 8px;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .circular-timer {
                width: 150px;
                height: 150px;
            }

            .timer-display {
                font-size: 2rem;
            }

            .timer-section {
                padding: 14px;
            }

            .day-selector {
                margin-bottom: 10px;
            }

            .current-exercise-display {
                padding: 12px;
            }

            .current-exercise-name {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="settings-btn" onclick="openSettings()" title="Settings">⚙</button>
            <h1>Fight Club</h1>
            <p>Week <span id="currentWeek">1</span> • 175→165 lbs</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div class="day-selector">
            <button class="day-btn" onclick="selectDay(1)"><span>MON</span></button>
            <button class="day-btn" onclick="selectDay(2)"><span>TUE</span></button>
            <button class="day-btn" onclick="selectDay(3)"><span>WED</span></button>
            <button class="day-btn" onclick="selectDay(4)"><span>THU</span></button>
            <button class="day-btn" onclick="selectDay(5)"><span>FRI</span></button>
            <button class="day-btn" onclick="selectDay(6)"><span>SAT</span></button>
            <button class="day-btn" onclick="selectDay(7)"><span>SUN</span></button>
        </div>

        <div id="workoutContainer"></div>

        <div class="stats">
            <div class="stat">
                <div class="stat-number" id="totalWorkouts">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="weekProgress">0</div>
                <div class="stat-label">This Week</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="currentStreak">0</div>
                <div class="stat-label">Streak</div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Settings</div>
                <button class="close-btn" onclick="closeSettings()">×</button>
            </div>
            <div class="setting-item">
                <div class="setting-label">Sound Effects</div>
                <div class="toggle-switch" id="soundToggle" onclick="toggleSound()"></div>
            </div>
            <div class="setting-item">
                <div class="setting-label">Notifications</div>
                <div class="toggle-switch" id="notificationToggle" onclick="toggleNotifications()"></div>
            </div>
            <div class="setting-item">
                <div class="setting-label">Auto-advance</div>
                <div class="toggle-switch active" id="autoAdvanceToggle" onclick="toggleAutoAdvance()"></div>
            </div>
            <div class="keyboard-shortcuts">
                <div style="font-weight: 600; margin-bottom: 10px;">⌨️ Keyboard Shortcuts</div>
                <div class="shortcut-item">
                    <span>Start/Pause Timer</span>
                    <span class="shortcut-key">SPACE</span>
                </div>
                <div class="shortcut-item">
                    <span>Reset Timer</span>
                    <span class="shortcut-key">R</span>
                </div>
                <div class="shortcut-item">
                    <span>Next Exercise</span>
                    <span class="shortcut-key">→</span>
                </div>
                <div class="shortcut-item">
                    <span>Previous Exercise</span>
                    <span class="shortcut-key">←</span>
                </div>
            </div>
            <button class="timer-btn full" onclick="resetAllProgress()" style="margin-top: 20px; background: linear-gradient(135deg, #ff3b30 0%, #ff453a 100%); border: none; box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3);">
                <span>Reset All Progress</span>
            </button>
        </div>
    </div>

    <script>
        const workoutData = {
            1: {
                title: "Upper Body KB",
                duration: "25-30 min",
                type: "circuit",
                warmup: ["Arm circles • Shoulder rolls • Band pull-aparts", "10 squats • 5 push-ups"],
                exercises: [
                    { name: "KB Swings", details: "Focus on hips, powerful movement" },
                    { name: "KB Clean & Press", details: "Alt arms each round" },
                    { name: "KB Rows", details: "Single arm, alt sides" },
                    { name: "Push-ups", details: "Modify as needed" },
                    { name: "KB High Pulls", details: "Explosive, full extension" },
                    { name: "Band Face Pulls", details: "Squeeze shoulder blades" }
                ],
                rounds: 4,
                workTime: 45,
                restTime: 15
            },
            2: {
                title: "HIIT Treadmill",
                duration: "30 min",
                type: "cardio",
                warmup: ["5 min at 3.0-3.5 mph"],
                exercises: [
                    { name: "High Intensity", details: "1 min at 4.5-5.0 mph" },
                    { name: "Recovery", details: "1 min at 3.0 mph" }
                ],
                rounds: 10,
                cooldown: ["5 min at 2.5-3.0 mph"],
                workTime: 60,
                restTime: 60
            },
            3: {
                title: "Lower & Core",
                duration: "25-30 min",
                type: "circuit",
                warmup: ["Leg swings • Hip circles • Bodyweight squats"],
                exercises: [
                    { name: "KB Goblet Squats", details: "Deep position, chest up" },
                    { name: "Single-leg Deadlifts", details: "KB opposite hand, balance" },
                    { name: "KB Swings", details: "Hip hinge, explosive" },
                    { name: "Band Squats", details: "Band above knees, push out" },
                    { name: "Plank", details: "Progress from knees to full" },
                    { name: "KB Figure-8s", details: "Around legs, smooth motion" }
                ],
                rounds: 4,
                workTime: 45,
                restTime: 15
            },
            4: {
                title: "Steady Cardio",
                duration: "45 min",
                type: "steady",
                exercises: [
                    { name: "Treadmill Walk", details: "3.5-4.0 mph, steady pace" },
                    { name: "Add Incline", details: "Start 2%, progress to 5-8%" }
                ]
            },
            5: {
                title: "Full Body",
                duration: "30 min",
                type: "circuit",
                warmup: ["Dynamic full body movements"],
                exercises: [
                    { name: "KB Clean & Squat", details: "Explosive, full movement" },
                    { name: "Push-ups to T", details: "With band resistance" },
                    { name: "KB Single Swing", details: "Alt arms, control" },
                    { name: "Band Rows", details: "Squeeze shoulder blades" },
                    { name: "KB Windmill", details: "Light weight, perfect form" },
                    { name: "Mountain Climbers", details: "Fast feet, core tight" }
                ],
                rounds: 5,
                workTime: 40,
                restTime: 20
            },
            6: {
                title: "Active Recovery",
                duration: "45-60 min",
                type: "steady",
                exercises: [
                    { name: "Brisk Walk", details: "3.0-3.5 mph, enjoy the movement" },
                    { name: "Incline Variation", details: "Mix it up, listen to body" }
                ]
            },
            7: {
                title: "Rest Day",
                type: "rest",
                message: "Your body grows during rest. Recovery is part of the process.",
                activities: ["Light stretching or yoga", "Meal prep for the week", "Get 8+ hours of quality sleep", "Hydrate and reflect on your progress"]
            }
        };

        let currentDay = 1;
        let currentExercise = 0;
        let currentRound = 1;
        let timerInterval;
        let currentTime = 0;
        let totalTime = 0;
        let isRunning = false;
        let isPaused = false;
        let isWorkPhase = true;
        let completedDays = JSON.parse(localStorage.getItem('completedDays') || '[]');
        let completedExercises = JSON.parse(localStorage.getItem('completedExercises') || '{}');
        let settings = JSON.parse(localStorage.getItem('settings') || '{"sound": true, "notifications": true, "autoAdvance": true}');

        // Audio context for sound effects
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioContext();

        function playBeep(frequency = 800, duration = 100) {
            if (!settings.sound) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = frequency;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration / 1000);
        }

        function showNotification(title, message) {
            if (!settings.notifications) return;

            // Browser notification
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, {
                    body: message,
                    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="75" font-size="75">💪</text></svg>'
                });
            }

            // In-app notification
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.innerHTML = `
                <div class="notification-title">${title}</div>
                <div class="notification-message">${message}</div>
            `;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);

            // Haptic feedback on mobile
            if ('vibrate' in navigator) {
                navigator.vibrate([100, 50, 100]);
            }
        }

        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        function selectDay(day) {
            stopTimer();
            currentDay = day;
            currentExercise = 0;
            currentRound = 1;
            isWorkPhase = true;
            isPaused = false;
            updateDayButtons();
            loadWorkout();
            saveState();
        }

        function updateDayButtons() {
            const buttons = document.querySelectorAll('.day-btn');
            buttons.forEach((btn, index) => {
                btn.classList.remove('active', 'completed');
                if (index + 1 === currentDay) btn.classList.add('active');
                if (completedDays.includes(index + 1)) btn.classList.add('completed');
            });
        }

        function loadWorkout() {
            const workout = workoutData[currentDay];
            const container = document.getElementById('workoutContainer');

            if (workout.type === 'rest') {
                container.innerHTML = `
                    <div class="rest-day">
                        <h2>🌙 Rest Day</h2>
                        <p style="color: #999; margin-bottom: 25px; line-height: 1.6;">${workout.message}</p>
                        <div class="warmup-list" style="text-align: left;">
                            ${workout.activities.map(a => `<p>${a}</p>`).join('')}
                        </div>
                        <button class="timer-btn full primary" onclick="markDayComplete()" style="margin-top: 25px;">
                            <span>✓ Mark Complete</span>
                        </button>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="workout-title">${workout.title}</div>
                <div class="workout-meta">${workout.duration}${workout.rounds ? ` • ${workout.rounds} rounds` : ''}</div>
            `;

            if (workout.type === 'circuit') {
                const radius = 102;
                const circumference = 2 * Math.PI * radius;
                const currentEx = workout.exercises[currentExercise];
                const nextEx = currentExercise < workout.exercises.length - 1 ? workout.exercises[currentExercise + 1] : null;

                html += `
                    <div class="timer-section">
                        <div class="current-exercise-display" id="currentExerciseDisplay">
                            <div class="exercise-progress">Exercise ${currentExercise + 1} of ${workout.exercises.length}</div>
                            <div class="current-exercise-name">${currentEx.name}</div>
                            <div class="current-exercise-details">${currentEx.details}</div>
                            ${nextEx ? `
                                <div class="next-up-display">
                                    <div class="next-up-label">Next Up</div>
                                    <div class="next-up-name">${nextEx.name}</div>
                                </div>
                            ` : ''}
                        </div>

                        <div class="phase-indicator">
                            <span id="currentPhase">WORK</span> • Round <span id="currentRound">1</span>/${workout.rounds}
                        </div>
                        <div class="timer-display-container">
                            <div class="circular-timer">
                                <svg viewBox="0 0 220 220" preserveAspectRatio="xMidYMid meet">
                                    <circle class="circular-timer-bg" cx="110" cy="110" r="${radius}"></circle>
                                    <circle class="circular-timer-progress work" cx="110" cy="110" r="${radius}"
                                        id="timerCircle"
                                        style="stroke-dasharray: ${circumference}; stroke-dashoffset: 0;">
                                    </circle>
                                </svg>
                                <div class="timer-display work" id="timerDisplay">
                                    ${formatTime(workout.workTime)}
                                    <div class="timer-display-label">READY</div>
                                </div>
                            </div>
                        </div>

                        <div class="exercise-tracker">
                            <div class="tracker-dots" id="trackerDots">
                                ${workout.exercises.map((ex, idx) => {
                                    const exerciseKey = `${currentDay}-${idx}`;
                                    const isCompleted = completedExercises[exerciseKey] || false;
                                    const isActive = idx === currentExercise;
                                    return `<div class="tracker-dot ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}"
                                            onclick="jumpToExercise(${idx})" title="${ex.name}"></div>`;
                                }).join('')}
                            </div>
                        </div>

                        <div class="timer-controls">
                            <button class="timer-btn primary" onclick="toggleTimer()" id="playPauseBtn">
                                <span>▶ Start</span>
                            </button>
                            <button class="timer-btn" onclick="stopTimer()">
                                <span>■ Stop</span>
                            </button>
                            <button class="timer-btn" onclick="resetTimer()">
                                <span>↺ Reset</span>
                            </button>
                            <button class="timer-btn" onclick="prevExercise()">
                                <span>← Prev</span>
                            </button>
                            <button class="timer-btn half" onclick="nextExercise()">
                                <span>Next →</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            html += `<div class="collapsible-section">`;

            if (workout.warmup) {
                html += `
                    <button class="collapse-btn" onclick="toggleCollapse(this)">
                        <span>🔥 Warm-up (5 min)</span>
                        <span>▼</span>
                    </button>
                    <div class="collapse-content">
                        <div class="warmup-list" style="margin-top: 10px;">
                            ${workout.warmup.map(item => `<p>${item}</p>`).join('')}
                        </div>
                    </div>
                `;
            }

            html += `
                <button class="collapse-btn" onclick="toggleCollapse(this)" style="margin-top: ${workout.warmup ? '10px' : '0'};">
                    <span>💪 All Exercises (${workout.exercises.length})</span>
                    <span>▼</span>
                </button>
                <div class="collapse-content">
                    <div class="exercise-list" style="margin-top: 10px;">
            `;

            workout.exercises.forEach((exercise, index) => {
                const exerciseKey = `${currentDay}-${index}`;
                const isCompleted = completedExercises[exerciseKey] || false;
                const isActive = index === currentExercise;

                html += `
                    <div class="exercise-item ${isCompleted ? 'completed' : ''} ${isActive ? 'active' : ''}"
                         id="exercise-${index}">
                        <div class="exercise-header">
                            <div>
                                <div class="exercise-name">${exercise.name}</div>
                                <div class="exercise-details">${exercise.details}</div>
                            </div>
                            <input type="checkbox" class="exercise-checkbox"
                                   ${isCompleted ? 'checked' : ''}
                                   onchange="toggleExercise(${index})">
                        </div>
                    </div>
                `;
            });

            html += `</div></div></div>`;

            if (workout.cooldown) {
                html += `
                    <div class="section-title">🧊 Cool-down</div>
                    <div class="warmup-list">
                        ${workout.cooldown.map(item => `<p>${item}</p>`).join('')}
                    </div>
                `;
            }

            html += `
                <button class="timer-btn full primary" onclick="completeWorkout()" style="margin-top: 25px;">
                    <span>✓ Complete Workout</span>
                </button>
            `;

            container.innerHTML = html;
            updateStats();

            // Restore timer state if exists
            const savedState = JSON.parse(localStorage.getItem('timerState') || '{}');
            if (savedState.day === currentDay && savedState.time > 0) {
                currentTime = savedState.time;
                currentExercise = savedState.exercise || 0;
                currentRound = savedState.round || 1;
                isWorkPhase = savedState.isWorkPhase !== false;
                updateTimerDisplay();
            }
        }

        function toggleTimer() {
            if (isRunning && !isPaused) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            const workout = workoutData[currentDay];
            if (!workout.workTime) return;

            if (!isRunning || isPaused) {
                isRunning = true;
                isPaused = false;

                if (currentTime === 0) {
                    currentTime = isWorkPhase ? workout.workTime : workout.restTime;
                    totalTime = currentTime;
                }

                document.getElementById('playPauseBtn').innerHTML = '<span>⏸ Pause</span>';
                playBeep(600, 100);

                timerInterval = setInterval(() => {
                    currentTime--;
                    updateTimerDisplay();
                    saveState();

                    if (currentTime <= 3 && currentTime > 0) {
                        playBeep(800, 100);
                    }

                    if (currentTime <= 0) {
                        playBeep(1000, 200);

                        if (isWorkPhase) {
                            isWorkPhase = false;
                            currentTime = workout.restTime;
                            totalTime = currentTime;
                            updatePhaseDisplay();
                            showNotification('Rest Time!', 'Take a break');
                        } else {
                            isWorkPhase = true;

                            if (settings.autoAdvance) {
                                if (currentExercise < workout.exercises.length - 1) {
                                    currentExercise++;
                                    showNotification('Next Exercise', workout.exercises[currentExercise].name);
                                } else {
                                    if (currentRound < workout.rounds) {
                                        currentRound++;
                                        currentExercise = 0;
                                        document.getElementById('currentRound').textContent = currentRound;
                                        showNotification('Round Complete!', `Starting Round ${currentRound}`);
                                    } else {
                                        stopTimer();
                                        showNotification('Workout Complete!', 'Great job! 💪');
                                        setTimeout(() => completeWorkout(), 1000);
                                        return;
                                    }
                                }
                            } else {
                                stopTimer();
                                showNotification('Exercise Complete!', 'Ready for next?');
                                return;
                            }

                            currentTime = workout.workTime;
                            totalTime = currentTime;
                            updatePhaseDisplay();
                            updateExerciseHighlight();
                        }
                    }
                }, 1000);
            }
        }

        function pauseTimer() {
            isPaused = true;
            isRunning = false;
            clearInterval(timerInterval);
            document.getElementById('playPauseBtn').innerHTML = '<span>▶ Resume</span>';
            playBeep(400, 100);
        }

        function stopTimer() {
            isRunning = false;
            isPaused = false;
            clearInterval(timerInterval);
            const btn = document.getElementById('playPauseBtn');
            if (btn) btn.innerHTML = '<span>▶ Start</span>';
        }

        function resetTimer() {
            stopTimer();
            currentTime = 0;
            currentExercise = 0;
            currentRound = 1;
            isWorkPhase = true;
            isPaused = false;
            const roundEl = document.getElementById('currentRound');
            if (roundEl) roundEl.textContent = currentRound;
            updateTimerDisplay();
            updatePhaseDisplay();
            loadWorkout();
            playBeep(500, 100);
            localStorage.removeItem('timerState');
        }

        function updateTimerDisplay() {
            const display = document.getElementById('timerDisplay');
            const circle = document.getElementById('timerCircle');

            if (display && circle) {
                const timeText = formatTime(currentTime);
                const label = isRunning ? (isWorkPhase ? 'WORK' : 'REST') : 'READY';
                display.innerHTML = `${timeText}<div class="timer-display-label">${label}</div>`;
                display.className = `timer-display ${isWorkPhase ? 'work' : 'rest'}`;
                circle.className = `circular-timer-progress ${isWorkPhase ? 'work' : 'rest'}`;

                const radius = 102;
                const circumference = 2 * Math.PI * radius;
                const progress = totalTime > 0 ? (currentTime / totalTime) : 1;
                const offset = circumference * (1 - progress);
                circle.style.strokeDashoffset = offset;
            }
        }

        function updatePhaseDisplay() {
            const phaseEl = document.getElementById('currentPhase');
            if (phaseEl) {
                phaseEl.textContent = isWorkPhase ? 'WORK' : 'REST';
            }
            updateTimerDisplay();
        }

        function nextExercise() {
            const workout = workoutData[currentDay];
            if (workout.exercises && currentExercise < workout.exercises.length - 1) {
                currentExercise++;
                updateExerciseHighlight();
                if (isRunning || isPaused) {
                    stopTimer();
                    currentTime = isWorkPhase ? workout.workTime : workout.restTime;
                    totalTime = currentTime;
                    updateTimerDisplay();
                }
                playBeep(600, 100);
                saveState();
            }
        }

        function prevExercise() {
            if (currentExercise > 0) {
                currentExercise--;
                updateExerciseHighlight();
                const workout = workoutData[currentDay];
                if (isRunning || isPaused) {
                    stopTimer();
                    currentTime = isWorkPhase ? workout.workTime : workout.restTime;
                    totalTime = currentTime;
                    updateTimerDisplay();
                }
                playBeep(600, 100);
                saveState();
            }
        }

        function updateExerciseHighlight() {
            const workout = workoutData[currentDay];
            if (!workout || !workout.exercises) return;

            // Update current exercise display
            const currentExDisplay = document.getElementById('currentExerciseDisplay');
            if (currentExDisplay) {
                const currentEx = workout.exercises[currentExercise];
                const nextEx = currentExercise < workout.exercises.length - 1 ? workout.exercises[currentExercise + 1] : null;

                currentExDisplay.innerHTML = `
                    <div class="exercise-progress">Exercise ${currentExercise + 1} of ${workout.exercises.length}</div>
                    <div class="current-exercise-name">${currentEx.name}</div>
                    <div class="current-exercise-details">${currentEx.details}</div>
                    ${nextEx ? `
                        <div class="next-up-display">
                            <div class="next-up-label">Next Up</div>
                            <div class="next-up-name">${nextEx.name}</div>
                        </div>
                    ` : '<div class="next-up-display"><div class="next-up-name" style="color: #4CAF50;">Last Exercise! 💪</div></div>'}
                `;
            }

            // Update tracker dots
            const dots = document.querySelectorAll('.tracker-dot');
            dots.forEach((dot, index) => {
                const exerciseKey = `${currentDay}-${index}`;
                const isCompleted = completedExercises[exerciseKey] || false;
                dot.className = 'tracker-dot';
                if (index === currentExercise) dot.classList.add('active');
                if (isCompleted) dot.classList.add('completed');
            });

            // Update exercise list items
            const items = document.querySelectorAll('.exercise-item');
            items.forEach((item, index) => {
                item.classList.toggle('active', index === currentExercise);
            });

            const activeExercise = document.getElementById(`exercise-${currentExercise}`);
            if (activeExercise) {
                activeExercise.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function jumpToExercise(index) {
            const workout = workoutData[currentDay];
            if (!workout || !workout.exercises || index < 0 || index >= workout.exercises.length) return;

            currentExercise = index;
            updateExerciseHighlight();

            if (isRunning || isPaused) {
                stopTimer();
                currentTime = isWorkPhase ? workout.workTime : workout.restTime;
                totalTime = currentTime;
                updateTimerDisplay();
            }

            playBeep(600, 100);
            saveState();
        }

        function toggleCollapse(button) {
            const content = button.nextElementSibling;
            const arrow = button.querySelector('span:last-child');

            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                arrow.textContent = '▼';
            } else {
                content.classList.add('expanded');
                arrow.textContent = '▲';
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function toggleExercise(index) {
            const exerciseKey = `${currentDay}-${index}`;
            completedExercises[exerciseKey] = !completedExercises[exerciseKey];
            localStorage.setItem('completedExercises', JSON.stringify(completedExercises));

            const exerciseElement = document.getElementById(`exercise-${index}`);
            if (exerciseElement) {
                exerciseElement.classList.toggle('completed');
            }

            // Update tracker dots
            const dots = document.querySelectorAll('.tracker-dot');
            if (dots[index]) {
                dots[index].classList.toggle('completed', completedExercises[exerciseKey]);
            }

            playBeep(700, 80);
            updateStats();
        }

        function completeWorkout() {
            if (!completedDays.includes(currentDay)) {
                completedDays.push(currentDay);
                localStorage.setItem('completedDays', JSON.stringify(completedDays));
                playBeep(900, 200);
                setTimeout(() => playBeep(1100, 200), 150);
                showNotification('Workout Complete!', 'Excellent work! 💪🔥');
            }
            updateDayButtons();
            updateStats();
            localStorage.removeItem('timerState');
        }

        function markDayComplete() {
            completeWorkout();
        }

        function updateStats() {
            const totalWorkouts = completedDays.length;
            const weekProgress = completedDays.filter(day => day <= 6).length;

            // Calculate streak (consecutive days from most recent)
            let streak = 0;
            const sortedDays = [...completedDays].sort((a, b) => b - a);
            if (sortedDays.length > 0) {
                streak = 1;
                for (let i = 0; i < sortedDays.length - 1; i++) {
                    if (sortedDays[i] - sortedDays[i + 1] === 1) {
                        streak++;
                    } else {
                        break;
                    }
                }
            }

            document.getElementById('totalWorkouts').textContent = totalWorkouts;
            document.getElementById('weekProgress').textContent = weekProgress;
            document.getElementById('currentStreak').textContent = streak;

            const progressPercent = (weekProgress / 6) * 100;
            document.getElementById('progressFill').style.width = `${Math.min(progressPercent, 100)}%`;

            const startDate = new Date(localStorage.getItem('startDate') || Date.now());
            const currentWeek = Math.floor((Date.now() - startDate.getTime()) / (7 * 24 * 60 * 60 * 1000)) + 1;
            document.getElementById('currentWeek').textContent = currentWeek;
        }

        function saveState() {
            const state = {
                day: currentDay,
                exercise: currentExercise,
                round: currentRound,
                time: currentTime,
                isWorkPhase: isWorkPhase,
                isPaused: isPaused
            };
            localStorage.setItem('timerState', JSON.stringify(state));
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
            updateSettingsUI();
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function updateSettingsUI() {
            document.getElementById('soundToggle').classList.toggle('active', settings.sound);
            document.getElementById('notificationToggle').classList.toggle('active', settings.notifications);
            document.getElementById('autoAdvanceToggle').classList.toggle('active', settings.autoAdvance);
        }

        function toggleSound() {
            settings.sound = !settings.sound;
            localStorage.setItem('settings', JSON.stringify(settings));
            updateSettingsUI();
            if (settings.sound) playBeep(800, 100);
        }

        function toggleNotifications() {
            settings.notifications = !settings.notifications;
            localStorage.setItem('settings', JSON.stringify(settings));
            updateSettingsUI();
            if (settings.notifications) {
                requestNotificationPermission();
                showNotification('Notifications Enabled', 'You\'ll be notified of timer events');
            }
        }

        function toggleAutoAdvance() {
            settings.autoAdvance = !settings.autoAdvance;
            localStorage.setItem('settings', JSON.stringify(settings));
            updateSettingsUI();
            playBeep(700, 80);
        }

        function resetAllProgress() {
            if (confirm('Are you sure you want to reset all progress? This cannot be undone.')) {
                localStorage.clear();
                completedDays = [];
                completedExercises = {};
                settings = {sound: true, notifications: true, autoAdvance: true};
                localStorage.setItem('startDate', Date.now());
                stopTimer();
                selectDay(1);
                closeSettings();
                showNotification('Progress Reset', 'Starting fresh! 💪');
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;

            const modal = document.getElementById('settingsModal');
            if (modal.classList.contains('active')) return;

            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    toggleTimer();
                    break;
                case 'r':
                case 'R':
                    resetTimer();
                    break;
                case 'ArrowRight':
                    nextExercise();
                    break;
                case 'ArrowLeft':
                    prevExercise();
                    break;
            }
        });

        // Close modal on outside click
        document.getElementById('settingsModal').addEventListener('click', (e) => {
            if (e.target.id === 'settingsModal') {
                closeSettings();
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            if (!localStorage.getItem('startDate')) {
                localStorage.setItem('startDate', Date.now());
            }

            requestNotificationPermission();

            // Auto-select today's workout
            const today = new Date().getDay() || 7;
            selectDay(today);
        });

        // Save state before page unload
        window.addEventListener('beforeunload', saveState);

        // Prevent audio context issues
        document.addEventListener('click', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }, { once: true });
    </script>
</body>
