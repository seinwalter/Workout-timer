<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fight Club">
    <meta name="theme-color" content="#000000">
    <meta name="format-detection" content="telephone=no">
    <title>Fight Club - Workout Timer</title>
    <link rel="preload" href="fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="settings-btn" onclick="openSettings()" title="Settings">⚙</button>
            <h1>Fight Club</h1>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div class="program-selector">
            <button class="program-btn" data-program="fightclub" onclick="selectProgram('fightclub')">Fight Club</button>
            <button class="program-btn" data-program="upperlower" onclick="selectProgram('upperlower')">Upper/Lower</button>
            <button class="program-btn" data-program="home45" onclick="selectProgram('home45')">Home 45</button>
        </div>

        <div class="day-selector">
            <button class="day-btn" onclick="selectDay(1)"><span>MON</span></button>
            <button class="day-btn" onclick="selectDay(2)"><span>TUE</span></button>
            <button class="day-btn" onclick="selectDay(3)"><span>WED</span></button>
            <button class="day-btn" onclick="selectDay(4)"><span>THU</span></button>
            <button class="day-btn" onclick="selectDay(5)"><span>FRI</span></button>
            <button class="day-btn" onclick="selectDay(6)"><span>SAT</span></button>
            <button class="day-btn" onclick="selectDay(7)"><span>SUN</span></button>
        </div>

        <div id="workoutContainer"></div>

        <div class="omad-card" id="eatCard">
            <div class="omad-header">
                <div>
                    <div class="omad-title">🍽 Eating Window</div>
                    <div class="omad-status" id="eatStatus">Off</div>
                </div>
                <div class="toggle-switch" id="eatToggle" onclick="toggleEatWindow()" role="switch" aria-label="Eating window"></div>
            </div>
            <div class="eat-body" id="eatBody" hidden></div>
        </div>

        <button class="stats" onclick="openHistory()" aria-label="Open history">
            <div class="stat">
                <div class="stat-number" id="totalWorkouts">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="weekProgress">0</div>
                <div class="stat-label">This Week</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="currentStreak">0</div>
                <div class="stat-label">Wk Streak</div>
            </div>
        </button>
        <button class="history-link" onclick="openHistory()">History, lifts &amp; weight ›</button>
    </div>

    <!-- Full-screen workout session (built by session-ui.js) -->
    <div class="session" id="session" aria-live="polite"></div>

    <!-- Settings -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Settings</div>
                <button class="close-btn" onclick="closeSettings()" aria-label="Close">×</button>
            </div>
            <div class="setting-item">
                <div class="setting-label">Sound Effects</div>
                <div class="toggle-switch" id="soundToggle" onclick="toggleSound()" role="switch"></div>
            </div>
            <div class="setting-item">
                <div class="setting-label">Voice Cues</div>
                <div class="toggle-switch" id="voiceToggle" onclick="toggleVoice()" role="switch"></div>
            </div>
            <div class="setting-item">
                <div class="setting-label">Notifications</div>
                <div class="toggle-switch" id="notificationToggle" onclick="toggleNotifications()" role="switch"></div>
            </div>
            <div class="setting-item">
                <div class="setting-label">Auto-advance</div>
                <div class="toggle-switch active" id="autoAdvanceToggle" onclick="toggleAutoAdvance()" role="switch"></div>
            </div>
            <div class="setting-item">
                <div class="setting-label">Apple Health<small>Save workouts, read weight</small></div>
                <div class="toggle-switch" id="healthToggle" onclick="toggleHealth()" role="switch"></div>
            </div>
            <div class="setting-item">
                <label class="setting-label" for="weightInput">Body weight (lb)</label>
                <input type="number" inputmode="numeric" id="weightInput" class="setting-input" min="80" max="400" onchange="setWeight(this.value)">
            </div>
            <div class="settings-note" id="settingsNote" hidden></div>
            <div class="setting-group-label">Backup</div>
            <div class="backup-row">
                <button class="ghost-btn" onclick="copyBackup()">Copy backup</button>
                <button class="ghost-btn" onclick="showRestore()">Restore…</button>
            </div>
            <textarea id="backupText" class="backup-text" hidden aria-label="Backup text"></textarea>
            <button class="start-btn" id="restoreBtn" hidden onclick="restoreBackup()">Restore this backup</button>
            <button class="timer-btn full" onclick="resetAllProgress()" style="margin-top: 20px; background: #ff4444;">
                <span>Reset All Progress</span>
            </button>
        </div>
    </div>

    <!-- Finish summary -->
    <div class="modal" id="summaryModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Workout complete 💪</div>
                <button class="close-btn" onclick="closeSummary()" aria-label="Close">×</button>
            </div>
            <div id="summaryBody" class="summary"></div>
        </div>
    </div>

    <!-- History -->
    <div class="modal" id="historyModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">History</div>
                <button class="close-btn" onclick="closeHistory()" aria-label="Close">×</button>
            </div>
            <div id="historyBody" class="history"></div>
        </div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/programs.js"></script>
    <script src="js/platform.js"></script>
    <script src="js/log.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/session-ui.js"></script>
    <script src="js/fasting.js"></script>
    <script src="js/history.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
